# Weekly version updates (ADR-0022 S6). Security alerts and security updates
# are repository settings, not this file. The ZAP image digest in zap.yml is not
# covered: refresh it by hand each quarter (y3s-automated-checks §6.5).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # Minor and patch updates come grouped; each major update comes as its own
    # pull request, so one breaking major (ESLint 10 before eslint-plugin-react
    # supports it, 2026-10-25) cannot hold back the patches.
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ['*']
