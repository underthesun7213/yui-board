# Deploys main after CI is green (B-13, ADR-0022 T-10 "deploys only from CI";
# runbook §7). Runs in the `production` environment: main only, with a
# required reviewer, so every deploy waits for the owner's approval in GitHub.
# Order as in runbook §7: database migrations, then the user app, then the
# admin console. Secrets live only in that environment (runbook §7.6).
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: # redeploy main by hand (Actions → deploy → Run workflow)
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false # never stop a deploy halfway
jobs:
  deploy:
    # a green CI run of a push to main in this repository, or a manual run on main
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://yunabi.juha.dev/
    env:
      YUNABI_ORIGIN: https://yunabi.juha.dev/
      VITE_SUPABASE_URL: https://tsbipaffirkswsgkydav.supabase.co
      # public values (they ship in the bundle), kept as environment variables
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      YUNABI_CF_BEACON: ${{ vars.CF_BEACON_TOKEN }} # Web Analytics site token (D37)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # exactly the commit CI passed, not whatever main is now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 1. Database (runbook §7.1). A no-op when nothing is pending.
      - name: Migrations (dry run)
        run: npx --yes supabase@2.122.0 db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Migrations
        run: npx --yes supabase@2.122.0 db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # 2. User app (runbook §7.3). build:deploy refuses a fixture, local or
      # e2e build and a missing key.
      - run: npm run build:deploy
      - name: No secrets in the app build
        run: node scripts/check-dist-secrets.mjs
      - name: Deploy the app
        run: npx --yes wrangler@4.86.0 deploy -c wrangler.app.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 3. Admin console (runbook §7.2), with the Turnstile site key so a
      # console deployed while CAPTCHA is on still shows its widget.
      - run: npm run build:admin
      - name: Deploy the admin console
        run: npx --yes wrangler@4.86.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 4. What is live answers with the headers we built.
      - name: Live headers
        run: |
          sleep 15
          app=$(curl -sfI https://yunabi.juha.dev/)
          admin=$(curl -sfI https://yunabi-admin.juha.dev/)
          echo "$app" | grep -qi "^content-security-policy:.*frame-ancestors 'none'"
          echo "$app" | grep -qi '^strict-transport-security:'
          echo "$admin" | grep -qi "^content-security-policy:.*frame-ancestors 'none'"
          echo "$admin" | grep -qi '^cache-control:.*no-store'
          echo "app and admin console answer with their security headers"
