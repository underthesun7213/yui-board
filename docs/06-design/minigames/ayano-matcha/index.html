<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아야노 미니게임</title>
<style>
/* YUNABI "Clear Sky" (src/styles/tokens.css), as in the Yuki prototype:
   a navy bar, a 4:3 table seen from above, then a dialogue card and plain
   buttons. The table is drawn on a canvas so the whisking and the latte
   art can react to the player's hand. */
:root {
  --canvas: #ffffff; --surface: #f4f7fa; --line: #dce3ea; --line-strong: #7d8995;
  --ink: #15202b; --body: #3b4855; --muted: #5b6875; --navy: #1d3e5c; --on-navy-muted: #b9d9ee;
  --primary: #1769aa; --primary-pressed: #105688; --primary-tint: #e6f3fc; --mist: #c9e9fb;
  --matcha: #5c8a2a; --ok-bg: #e3f4e1; --ok-fg: #1e5b22; --hm-bg: #fde8e6; --hm-fg: #a3241b; --gold: #e9a23b;
  --r-s: 8px; --r-m: 12px; --r-l: 16px;
  --f-en: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: linear-gradient(180deg, var(--mist) 0, var(--surface) 280px);
  color: var(--body); font: 16px/1.55 var(--f-en);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
:lang(ja) { font-family: var(--f-ja); }
.game { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }
.hud { display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; border-radius: var(--r-l); padding: 8px 10px; }
.chip { margin-right: auto; font: 600 14px/1 var(--f-en); color: var(--on-navy-muted); background: #ffffff14; border-radius: 999px; padding: 7px 10px; white-space: nowrap; }
.mute { min-width: 44px; height: 36px; border-radius: 999px; border: 1px solid #ffffff44; background: transparent; color: #fff; cursor: pointer; font: 600 13px/1 var(--f-en); }

.stage { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-l); overflow: hidden; background: #b88758; box-shadow: 0 1px 0 var(--line), 0 8px 24px #1d3e5c22; touch-action: none; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tip { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); max-width: 86%; background: var(--canvas); color: var(--ink); border: 2px solid var(--navy); border-radius: 18px; padding: 6px 14px; font: 700 15px/1.9 var(--f-ja); box-shadow: 0 6px 18px #1d3e5c33; pointer-events: none; text-align: center; }
.tip rt { font: 500 9px/1 var(--f-ja); color: var(--muted); }
.tip small { display: block; font: 500 12px/1.3 var(--f-en); color: var(--muted); }
.ach { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #15202bb3; padding: 16px; }
.ach > div { background: var(--canvas); border-radius: var(--r-l); padding: 14px; width: min(320px, 100%); display: grid; gap: 8px; text-align: center; box-shadow: 0 10px 30px #0006; }
.ach .k { font: 800 12px/1 var(--f-en); letter-spacing: .12em; color: var(--gold); }
.ach img { width: 100%; max-height: 40vh; aspect-ratio: 3 / 2; object-fit: cover; border-radius: var(--r-m); background: #b88758; }
.ach b { font: 800 19px/1.9 var(--f-ja); color: var(--navy); }
.ach b rt { font-size: 9px; color: var(--muted); }
.ach p { margin: 0; font-size: 13px; color: var(--muted); }

.panel { display: grid; gap: 10px; }
.lead { font: 600 13px/1.4 var(--f-en); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.lead [lang="ja"] { text-transform: none; }
.dlg { position: relative; background: var(--canvas); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px 50px 12px 16px; cursor: pointer; min-height: 96px; box-shadow: 0 2px 8px #1d3e5c14; }
.dlg .name { position: absolute; top: -12px; left: 14px; background: var(--navy); color: #fff; border-radius: 999px; padding: 2px 12px; font: 700 13px/1.6 var(--f-ja); }
.dlg.ayano .name { background: #8a2b3a; }
.dlg .jp { font: 700 19px/2 var(--f-ja); min-height: 38px; }
.dlg .jp rt, .gbtn rt, .fb rt, .phr rt, .say-ja rt { font: 500 10px/1 var(--f-ja); color: var(--muted); }
.dlg .en { font-size: 15px; color: var(--muted); }
.dlg .say { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--primary-tint); color: var(--primary); cursor: pointer; font: 12px/1 var(--f-en); }
.choices { display: grid; gap: 8px; }
.gbtn { position: relative; min-height: 52px; padding: 8px 44px 8px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-m); cursor: pointer; background: var(--canvas); color: var(--ink); font: 700 17px/1.8 var(--f-ja); text-align: left; }
.gbtn:hover { background: var(--primary-tint); border-color: var(--primary); }
.gbtn[disabled] { cursor: default; opacity: .5; background: var(--surface); }
.gbtn.right { background: var(--ok-bg); border-color: var(--ok-fg); color: var(--ok-fg); opacity: 1; }
.gbtn.wrong { background: var(--hm-bg); border-color: var(--hm-fg); color: var(--hm-fg); opacity: 1; }
.gbtn .mark { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 800 22px/1 var(--f-en); }
.go { justify-self: center; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; cursor: pointer; font: 700 16px/1 var(--f-en); color: #fff; background: var(--primary); box-shadow: 0 3px 10px #1769aa44; }
.go:hover { background: var(--primary-pressed); }
.go[disabled] { background: var(--line-strong); box-shadow: none; cursor: default; }
.go.ghost { background: var(--canvas); color: var(--primary); border: 1px solid var(--primary); box-shadow: none; }
.go.hold { background: var(--matcha); box-shadow: 0 3px 10px #5c8a2a55; min-width: 200px; touch-action: none; user-select: none; -webkit-user-select: none; }
.go.hold.on { background: #46701c; transform: translateY(1px); }
.go .ja { font-family: var(--f-ja); }
.acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.fb { background: var(--ok-bg); color: var(--ok-fg); border-radius: var(--r-m); padding: 10px 14px; font-size: 15px; }
.fb.no { background: var(--hm-bg); color: var(--hm-fg); }
.fb.info { background: var(--primary-tint); color: #0f4c7a; }
.fb b { font: 700 14px/1.5 var(--f-en); display: block; }
.fb .say-ja { font: 700 16px/1.9 var(--f-ja); display: block; }
.meter { background: var(--canvas); border: 1px solid var(--line); border-radius: 999px; height: 32px; position: relative; overflow: hidden; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: #cfe3a8; }
.meter > u { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--matcha); border-right: 2px dashed var(--matcha); background: #5c8a2a1c; }
.meter > span { position: relative; display: block; text-align: center; font: 700 14px/30px var(--f-en); color: var(--ink); font-variant-numeric: tabular-nums; }
.meter.over > i { background: #f6c9c3; }
.steps { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.steps span { padding: 3px 10px; border-radius: 999px; background: var(--canvas); border: 1px solid var(--line); font: 700 13px/1.7 var(--f-ja); color: var(--muted); }
.steps span.on { background: var(--primary-tint); border-color: var(--primary); color: var(--primary); }
.steps span.done { background: var(--ok-bg); border-color: var(--ok-fg); color: var(--ok-fg); }
.phr { display: grid; gap: 6px; }
.phr > b { color: var(--ink); }
.phr div { background: var(--canvas); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-m); padding: 6px 12px; }
.phr .j { font: 700 17px/1.9 var(--f-ja); }
.phr .k { font-size: 14px; color: var(--muted); }
.title { text-align: center; font: 800 26px/1.2 var(--f-ja); color: var(--navy); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>
<div class="game">
  <div class="hud"><span class="chip" id="chip">抹茶セット</span><button class="mute" id="mute" aria-label="Sound on or off">ON</button></div>
  <div class="stage" id="stage"><canvas id="cv" aria-label="The table seen from above: the tea set, a tea bowl and a latte cup"></canvas><div id="fx"></div></div>
  <div class="panel" id="panel" aria-live="polite"></div>
</div>
<script>
'use strict';
/* ===================== helpers ===================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const rb = (s) => esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
const plain = (s) => s.replace(/\{([^|}]+)\|([^}]+)\}/g, '$2');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mix(c1, c2, t) {
  const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const a = p(c1), b = p(c2);
  return '#' + a.map((v, i) => Math.round(lerp(v, b[i], clamp(t, 0, 1))).toString(16).padStart(2, '0')).join('');
}
function tokens(s) {
  const out = []; const re = /\{([^|}]+)\|([^}]+)\}/g; let i = 0, m;
  while ((m = re.exec(s))) { for (const ch of s.slice(i, m.index)) out.push(esc(ch)); out.push(`<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>`); i = re.lastIndex; }
  for (const ch of s.slice(i)) out.push(esc(ch));
  return out;
}
/* a fixed scatter, so bubbles and clumps don't jump between frames */
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const SCATTER = Array.from({ length: 220 }, () => ({ a: rnd() * Math.PI * 2, r: Math.sqrt(rnd()), s: rnd() }));

/* ===================== sound (synthesised, no files) ===================== */
const SFX = (() => {
  let ac = null, on = true;
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f, t, dur, type = 'sine', vol = .06, f2) {
    const a = on && ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(t, dur, vol, freq, kind = 'bandpass') {
    const a = on && ctx(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t0 = a.currentTime + t;
    s.buffer = buf; f.type = kind; f.frequency.value = freq; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(f).connect(g).connect(a.destination); s.start(t0);
  }
  return {
    blip: () => tone(1200 + Math.random() * 200, 0, .02, 'triangle', .025),
    ok: () => { tone(660, 0, .1, 'triangle', .07); tone(990, .09, .2, 'triangle', .07); },
    ng: () => { tone(330, 0, .16, 'triangle', .06, 250); tone(250, .14, .22, 'triangle', .06, 200); },
    click: () => tone(500, 0, .03, 'triangle', .04),
    scoop: () => { noise(0, .12, .05, 2500); tone(900, .05, .05, 'sine', .03); },
    swish: () => noise(0, .09, .06, 3200 + Math.random() * 800, 'highpass'),
    pour: () => noise(0, .16, .035, 700 + Math.random() * 300),
    chime: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .11, .5, 'sine', .05)),
    clack: () => { tone(220, 0, .05, 'square', .03); noise(0, .05, .05, 1500); },
    unlock: () => ctx(),
    toggle: () => (on = !on),
    get on() { return on; },
  };
})();
let voiceOk = false;
try { voiceOk = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'; } catch (e) { voiceOk = false; }
function speak(text) {
  if (!voiceOk || !SFX.on) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain(text)); u.lang = 'ja-JP'; u.rate = .9; speechSynthesis.speak(u); } catch (e) { /* no voice */ }
}

/* ===================== the table (canvas, 800 × 600 logical) ===================== */
const W = 800, H = 600;
const cv = $('cv'), g = cv.getContext('2d');
const BOWL = { x: 300, y: 365, r: 150, ri: 124 };
const CUP = { x: 612, y: 380, r: 100, ri: 87, saucer: 134 };
const TOOLS = {
  chasen:    { look: 'the round bamboo whisk with many fine tines, bottom left', x: 100, y: 500, r: 50, ja: '{茶筅|ちゃせん}', en: 'tea whisk', jp: '茶筅', kana: 'ちゃせん' },
  chashaku:  { look: 'the long, thin bamboo stick along the top', x: 335, y: 82, r: 26, ja: '{茶杓|ちゃしゃく}', en: 'bamboo tea scoop', jp: '茶杓', kana: 'ちゃしゃく' },
  natsume:   { x: 105, y: 125, r: 52, ja: '{棗|なつめ}', en: 'tea caddy', jp: '棗', kana: 'なつめ' },
  yuzamashi: { x: 700, y: 110, r: 52, ja: '{湯冷|ゆざ}まし', en: 'pitcher of hot water', jp: '湯冷まし', kana: 'ゆざまし' },
  pitcher:   { x: 545, y: 105, r: 46, ja: 'ミルクピッチャー', en: 'milk pitcher', jp: 'ミルクピッチャー', kana: '', up: true },
  chawan:    { x: BOWL.x, y: BOWL.y, r: BOWL.r, ja: '{茶碗|ちゃわん}', en: 'tea bowl', jp: '茶碗', kana: 'ちゃわん' },
  cup:       { x: CUP.x, y: CUP.y, r: CUP.saucer, ja: 'カップ', en: 'cup', jp: 'カップ', kana: '' },
};
const freshBowl = () => ({ piles: [], water: 0, foam: 0, acc: 1 });
const freshCup = () => ({ piles: [], water: 0, foam: 0, acc: 1, milk: 0, dot: 0, dc: { x: 0, y: 0 }, cut: null, art: null });
const S = {
  step: 0, arrive: 0,
  bowl: freshBowl(), cup: freshCup(),
  labels: {}, mark: null,      // tool labels shown; a tool briefly ringed
  scoop: null,                 // the scoop flying on its own (Ayano's latte base)
  drag: null,                  // the tool in the player's hand: { tool, x, y, ... }
  hold: null,                  // what the hand can pick up on this screen, and what it does
  lid: 0,                      // the caddy's lid, 0 shut … 1 slid open
  tries: 0, got: false, said: [],
};

/* textures: fine grains, so powder and froth read as stuff, not as shapes */
function texture(n, paint) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); seed = 3 + n;
  for (let i = 0; i < n; i++) paint(x, rnd() * 128, rnd() * 128, rnd());
  return g.createPattern(c, 'repeat');
}
const POWDER_TEX = texture(2600, (x, px, py, r) => { x.fillStyle = r < .4 ? '#c4e384' : r < .75 ? '#5d8a26' : '#9cc95a'; x.globalAlpha = .35 + r * .5; x.fillRect(px, py, r < .9 ? 1 : 2, r < .9 ? 1 : 2); });
const FOAM_FINE = texture(2400, (x, px, py, r) => { x.fillStyle = r < .8 ? '#eef7d2' : '#6f9532'; x.globalAlpha = .25 + r * .55; x.fillRect(px, py, r < .7 ? 1 : 1.6, r < .7 ? 1 : 1.6); });
const FOAM_COARSE = texture(70, (x, px, py, r) => { x.strokeStyle = 'rgba(240,250,215,.8)'; x.lineWidth = 1; x.beginPath(); x.arc(px, py, 2 + r * 3.5, 0, Math.PI * 2); x.stroke(); });
const MILK_TEX = texture(1600, (x, px, py, r) => { x.fillStyle = '#ffffff'; x.globalAlpha = .15 + r * .3; x.fillRect(px, py, 1, 1); });

let wood = null;
function paintWood() {
  wood = document.createElement('canvas'); wood.width = W; wood.height = H;
  const w = wood.getContext('2d');
  const gr = w.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#c99a68'); gr.addColorStop(1, '#a87446');
  w.fillStyle = gr; w.fillRect(0, 0, W, H);
  seed = 11;
  for (let i = 0; i < 46; i++) {
    const y0 = rnd() * H; w.strokeStyle = `rgba(90,52,24,${.05 + rnd() * .09})`; w.lineWidth = 1 + rnd() * 2.5;
    w.beginPath(); for (let x = -10; x <= W + 10; x += 20) w.lineTo(x, y0 + Math.sin(x / (60 + rnd() * 40) + i) * 5); w.stroke();
  }
  w.fillStyle = '#efe3c9'; w.strokeStyle = '#d7c49e'; w.lineWidth = 3;
  round(w, 30, 40, 740, 530, 18); w.fill(); w.stroke();
  w.strokeStyle = 'rgba(160,130,80,.18)'; w.lineWidth = 1;
  for (let y = 52; y < 566; y += 7) { w.beginPath(); w.moveTo(40, y); w.lineTo(760, y); w.stroke(); }
}
function round(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function disc(x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function shadow(x, y, r, a = .22, off = 1) { const gr = g.createRadialGradient(x + 8 * off, y + 12 * off, r * .6, x + 8 * off, y + 12 * off, r * 1.15); gr.addColorStop(0, `rgba(40,20,5,${a})`); gr.addColorStop(1, 'rgba(40,20,5,0)'); disc(x + 8 * off, y + 12 * off, r * 1.15, gr); }

/* a heap of powder: a lumpy outline, light on the top left, grains all over,
   and a little dust spilled round it */
function blob(x, y, s, k) {
  g.beginPath();
  for (let i = 0; i <= 24; i++) {
    const a = i / 24 * Math.PI * 2, rr = s * (1 + .13 * Math.sin(a * 3 + k) + .07 * Math.sin(a * 5 + k * 2.3));
    i ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath();
}
function pile(x, y, s, k = 0) {
  g.save(); g.shadowColor = 'rgba(40,25,5,.35)'; g.shadowBlur = s * .5; g.shadowOffsetY = s * .15;
  blob(x, y, s, k);
  const gr = g.createRadialGradient(x - s * .35, y - s * .4, s * .05, x, y, s * 1.15);
  gr.addColorStop(0, '#bddc7a'); gr.addColorStop(.45, '#88b545'); gr.addColorStop(1, '#557f20');
  g.fillStyle = gr; g.fill(); g.restore();
  g.save(); blob(x, y, s, k); g.clip(); g.globalAlpha = .6; g.fillStyle = POWDER_TEX; g.fillRect(x - s * 1.3, y - s * 1.3, s * 2.6, s * 2.6); g.restore();
  g.fillStyle = 'rgba(110,160,55,.6)';
  for (let i = 0; i < 30; i++) { const p = SCATTER[Math.floor(i * 7 + k * 13) % SCATTER.length]; const d = s * (1.04 + p.r * .4); g.fillRect(x + Math.cos(p.a) * d, y + Math.sin(p.a) * d, 1.3, 1.3); }
}
function drawNatsume() {
  const { x, y, r } = TOOLS.natsume; shadow(x, y, r);
  disc(x, y, r, '#1a1210');
  // the tea inside, seen when the lid slides
  g.save(); g.beginPath(); g.arc(x, y, r - 7, 0, Math.PI * 2); g.clip();
  const gp = g.createRadialGradient(x - 12, y - 14, 4, x, y, r); gp.addColorStop(0, '#a9cf63'); gp.addColorStop(1, '#4f781c');
  g.fillStyle = gp; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.fillStyle = POWDER_TEX; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  if (S.drag && S.drag.tool === 'chashaku' && S.drag.dig) { g.fillStyle = 'rgba(40,60,15,.35)'; blob(S.drag.x, S.drag.y, 10, 2); g.fill(); }
  g.restore();
  const k = easeOut(S.lid), lx = x + k * 46, ly = y - k * 22;
  g.save(); g.translate(lx, ly); g.rotate(k * .35);
  if (k > .02) shadow(0, 0, r, .25 * k, .6);
  const gr = g.createRadialGradient(-15, -18, 4, 0, 0, r); gr.addColorStop(0, '#4a3a33'); gr.addColorStop(1, '#130d0b');
  disc(0, 0, r, gr);

  const toks = tokens(markup); let i = 0, t = 0;
  const finish = () => { clearTimeout(t); el.innerHTML = toks.join(''); typing = null; done && done(); };
  if (calm) return finish();
  typing = { finish, stop: () => clearTimeout(t) };
  const step = () => {
    i++; el.innerHTML = toks.slice(0, i).join(''); if (i % 2) SFX.blip();
    if (i >= toks.length) { typing = null; done && done(); return; }
    t = setTimeout(step, 36);
  };
  step();
}
function dialog(who, jp, en, after) {
  const box = document.createElement('div'); box.className = 'dlg' + (who === 'あやの' ? ' ayano' : '');
  box.innerHTML = `<span class="name">${esc(who)}</span>${voiceOk ? '<button class="say" aria-label="Listen in Japanese">▶</button>' : ''}<div class="jp" lang="ja"></div><div class="en" hidden>${esc(en)}</div>`;
  box.querySelector('.say')?.addEventListener('click', (e) => { e.stopPropagation(); speak(jp); });
  box.addEventListener('click', () => typing && typing.finish());
  const my = gen;
  later(() => typewriter(box.querySelector('.jp'), jp, () => { if (my !== gen) return; box.querySelector('.en').hidden = false; after && after(); }), 0);
  return box;
}
function talk(p, lines, after) {
  let i = 0;
  const one = () => { if (i >= lines.length) return after && after(); const [who, jp, en] = lines[i++]; p.appendChild(dialog(who, jp, en, () => later(one, 250))); };
  one();
}
function remember(jp, en) { if (!S.said.some((x) => x.jp === jp)) S.said.push({ jp, en }); }
function tip(jp, en, ms = 2600) {
  const el = document.createElement('div'); el.className = 'tip';
  el.innerHTML = `<span lang="ja">${rb(jp)}</span><small>${esc(en)}</small>`;
  $('fx').replaceChildren(el); speak(jp);
  setTimeout(() => el.remove(), ms);
}
function fb(p, ok, head, body, ayano) {
  p.querySelector('.fb')?.remove();
  const el = document.createElement('div'); el.className = 'fb' + (ok === true ? '' : ok === false ? ' no' : ' info');
  el.innerHTML = `<b>${esc(head)}</b>${ayano ? `<span class="say-ja" lang="ja">あやの「${rb(ayano)}」</span>` : ''}${esc(body)}`;
  p.appendChild(el); if (ayano) speak(ayano);
  return el;
}
function goBtn(p, text, onClick, cls = '') {
  p.querySelector('.go')?.remove();
  const b = document.createElement('button'); b.className = 'go ' + cls; b.innerHTML = text; b.onclick = () => { SFX.click(); onClick(); }; p.appendChild(b); return b;
}
function meter(p, lo, hi, max) {
  const m = document.createElement('div'); m.className = 'meter';
  m.innerHTML = `${lo != null ? `<u style="left:${lo / max * 100}%;width:${(hi - lo) / max * 100}%"></u>` : ''}<i style="width:0"></i><span></span>`;
  p.appendChild(m);
  return (v, text, over) => { m.querySelector('i').style.width = clamp(v / max * 100, 0, 100) + '%'; m.querySelector('span').textContent = text; m.classList.toggle('over', !!over); };
}
function choices(p, opts, onRight) {
  const c = document.createElement('div'); c.className = 'choices';
  c.innerHTML = opts.map((o, i) => `<button class="gbtn" lang="ja" data-i="${i}">${rb(o.jp)}</button>`).join('');
  p.appendChild(c);
  c.addEventListener('click', (e) => {
    const b = e.target.closest('.gbtn'); if (!b || b.disabled) return;
    const o = opts[+b.dataset.i]; speak(o.jp);
    if (o.ok) {
      b.classList.add('right'); b.insertAdjacentHTML('beforeend', '<span class="mark">○</span>');
      c.querySelectorAll('.gbtn').forEach((x) => { x.disabled = true; }); SFX.ok(); remember(o.jp, o.en);
      fb(p, true, '○ ナイス!', o.fb, o.reply); later(() => onRight(o), 300);
    } else {
      b.classList.add('wrong'); b.disabled = true; b.insertAdjacentHTML('beforeend', '<span class="mark">×</span>'); SFX.ng();
      fb(p, false, '× もう一回!', o.fb, o.reply);
    }
  });
}

/* ===================== the game ===================== */
const STEP = { intro: 0, tools: 1, powder: 2, water: 3, whisk: 4, base: 5, art: 6, serve: 7, end: 8 };
const FLOW = ['intro', 'tools', 'powder', 'water', 'whisk', 'base', 'art', 'serve', 'end'];
const panel = () => $('panel');
function go(k) {
  gen++; if (typing) { typing.stop(); typing = null; }
  S.step = STEP[k]; S.demo = null; S.mode = null; S.scoop = null; S.drag = null; S.hold = null; S.mark = null; $('fx').replaceChildren();
  const stage = { tools: 1, powder: 2, water: 2, whisk: 3, base: 4, art: 5, serve: 6 }[k];
  $('chip').textContent = stage ? `STAGE ${stage} / 6` : S.step ? 'おしまい' : '抹茶セット';
  panel().replaceChildren(); VIEW[k](); window.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
}
const next = () => go(FLOW[S.step + 1]);
function lead(p, html) { const l = document.createElement('div'); l.className = 'lead'; l.innerHTML = html; p.appendChild(l); }

const VIEW = {
  intro() {
    const p = panel(); S.arrive = 0;
    lead(p, 'Kyoto · a matcha tea house · 午後');
    talk(p, [
      ['店員', 'お{待|ま}たせいたしました。{抹茶|まっちゃ}セットでございます。お{茶|ちゃ}はご{自分|じぶん}で{点|た}てていただけます。', 'Here is your matcha set. You whisk the tea yourselves.'],
      ['あやの', 'わぁ、{自分|じぶん}で{点|た}てるんやて。うちのは、ミルク{入|い}れてラテにしてもろてもええ？', 'Oh, we whisk it ourselves! Could you make mine a latte, with milk?'],
    ], () => choices(p, [
      { jp: 'もちろん！まかせてください。', en: 'Of course! Leave it to me.', ok: true, reply: 'おおきに。{楽|たの}しみにしてますえ。', fb: 'She asked a favour very softly. A cheerful yes makes it easy for her to have asked.' },
      { jp: 'え、{自分|じぶん}で{作|つく}ったらどうですか？', en: 'Why not make it yourself?', ok: false, reply: 'あら……そうどすなぁ。', fb: 'A gentle Kyoto request, turned straight back on her. Her "I see…" is a polite retreat, not agreement.' },
      { jp: 'ラテはメニューにないので、{無理|むり}です。', en: "There's no latte on the menu, so no.", ok: false, reply: 'ミルク、ちゃんと{付|つ}いてますえ？', fb: 'The set comes with a milk pitcher; she has already seen it. Look at the table!' },
    ], () => goBtn(p, 'Make the tea ▶', next)));
  },

  tools() {
    const p = panel(); lead(p, 'STAGE 1 · <span lang="ja">お道具</span> — tap the tool she names');
    const quiz = ['chasen', 'chashaku']; let q = 0;
    const ask = () => {
      const k = quiz[q];
      p.querySelector('.dlg')?.remove(); p.querySelector('.fb')?.remove();
      p.appendChild(dialog('あやの', q ? `ほな、${TOOLS[k].ja}は？` : `これ、なんて{言|い}うか{知|し}ってはる？ ${TOOLS[k].ja}はどれやと{思|おも}う？`, q ? `And the ${TOOLS[k].en}?` : `Do you know what these are called? Which one is the ${TOOLS[k].en}?`, () => { S.mode = 'tools'; S.want = k; fb(p, null, `Which one is the ${TOOLS[k].jp} (${TOOLS[k].kana}), the ${TOOLS[k].en}?`, 'Tap it on the table. Every tool you can tap has a dashed ring.'); }));
    };
    S.onTool = (hit) => {
      const k = S.want; if (!hit) return;
      if (hit === k) {
        S.mark = { k: hit, ok: true }; S.labels[hit] = 1; SFX.ok(); S.mode = null; remember(TOOLS[hit].ja, TOOLS[hit].en);
        fb(p, true, `○ ${TOOLS[hit].jp}`, hit === 'chasen'
          ? 'A whisk carved from one piece of bamboo into some 80 fine tines. 点てる (たてる) is the verb for whisking tea.'
          : 'The scoop. Scoops are counted with 杯: 一杯 いっぱい, 二杯 にはい, 三杯 さんばい.');
        later(() => { S.mark = null; q++; if (q < quiz.length) ask(); else { Object.keys(TOOLS).forEach((t) => { S.labels[t] = 1; }); goBtn(p, 'Next ▶', () => { S.labels = {}; next(); }); } }, 1400);
      } else {
        S.mark = { k: hit, ok: false }; S.labels[hit] = 1; SFX.ng();
        fb(p, false, '× not that one', `That's the ${TOOLS[hit].en}. The ${TOOLS[k].jp} is ${TOOLS[k].look}.`, `それは${TOOLS[hit].ja}どすえ。`);
        later(() => { if (S.mark && S.mark.k === hit) S.mark = null; delete S.labels[hit]; }, 1600);
      }
    };
    ask();
  },

  powder() {
    const p = panel(); lead(p, 'STAGE 2 · Your matcha — scoop the powder');
    S.bowl = freshBowl();
    p.appendChild(dialog('あやの', 'お{抹茶|まっちゃ}は、お{茶杓|ちゃしゃく}で{二杯|にはい}くらいが{目安|めやす}どす。', 'About two scoops of matcha is the rule of thumb.', () => {
      const count = document.createElement('div'); count.className = 'title'; count.lang = 'ja'; p.appendChild(count);
      const COUNT = ['—', '{一杯|いっぱい}', '{二杯|にはい}', '{三杯|さんばい}', '{四杯|よんはい}'];
      fb(p, null, 'Scoop · follow the dashed line', 'Press the bamboo scoop and drag it into the caddy (the lid slides open), hold it there a moment, then drag it over the bowl. Twice.');
      demo([...arc(TOOLS.chashaku, TOOLS.natsume, 40), ...arc(TOOLS.natsume, { x: BOWL.x - 20, y: BOWL.y - 10 }, 50).slice(1)], { ms: 2400, keep: true });
      const done = goBtn(p, '<span class="ja" lang="ja">できた</span> · Done', () => {
        const n = S.bowl.piles.length;
        if (n === 2) {
          SFX.ok(); S.hold = null; remember('{二杯|にはい}', 'two scoops (cups, glasses: 杯)');
          fb(p, true, '○ 二杯 (にはい)', 'About 2 g, a usual bowl. Count scoops and cups with 杯: いっぱい, にはい, さんばい — the sound changes, like 本.');
          goBtn(p, 'Next ▶', next);
        } else if (n < 2) {
          SFX.ng(); fb(p, false, '× a little more', '"It might turn out a bit thin" — Kyoto speech hints rather than says "add more".', 'ちょっと{薄|うす}いお{茶|ちゃ}になりそうどすなぁ。');
          p.appendChild(done);
        } else {
          SFX.ng(); fb(p, false, '× too much — start again', '"You must like it strong" sounds like a compliment, but it means: that is too much. The bowl is emptied.', 'まぁ、{濃|こ}いお{茶|ちゃ}がお{好|す}きなんどすなぁ。');
          S.bowl.piles = []; p.appendChild(done);
        }
        paint();
      }, 'ghost');
      const paint = () => { count.innerHTML = rb(COUNT[S.bowl.piles.length]); done.disabled = !S.bowl.piles.length; };
      S.hold = { tool: 'chashaku', hint: true, grab: 60,
        tick(dt, d) {
          if (d.dig && !d.loaded) { d.wait = (d.wait || 0) + dt; if (d.wait > .3) { d.loaded = true; d.wait = 0; SFX.scoop(); } }
          if (d.loaded && Math.hypot(d.x - BOWL.x, d.y - BOWL.y) < BOWL.ri * .8 && S.bowl.piles.length < 4) {   // tipped into the bowl
            const a = Math.atan2(d.y - BOWL.y, d.x - BOWL.x), r = Math.min(BOWL.ri * .3, Math.hypot(d.x - BOWL.x, d.y - BOWL.y));
            S.bowl.piles.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, s: 30, k: S.bowl.piles.length * 1.7 });
            d.loaded = false; SFX.scoop(); paint();
          }
        } };
      paint();
    }));
  },

  water() {
    const p = panel(); lead(p, 'STAGE 2 · Your matcha — pour the hot water');
    p.appendChild(dialog('あやの', 'お{湯|ゆ}は{七十|ななじゅう}ミリくらい。ゆっくり{注|そそ}いでな。', 'About 70 ml of hot water. Pour slowly.', () => {
      pourStep(p, { into: 'bowl', lo: 60, hi: 80, max: 110, rate: 24,
        over: ['あらまぁ、たっぷりどすなぁ。', '"How generous" — too much water; the tea would be weak. Let\'s pour it again.'],
        how: 'Drag the water pitcher over the bowl: it pours while it\'s there. Lift your finger in the band. 70 ml is ななじゅうミリ.' });
    }));
  },

  whisk() {
    const p = panel(); lead(p, 'STAGE 3 · <span lang="ja">点てる</span> — whisk the tea');
    p.appendChild(dialog('あやの', '{茶筅|ちゃせん}で、Wの{字|じ}を{描|か}くようにシャカシャカ。くるくる{回|まわ}したらあかんえ。', 'Whisk in a W, shaka-shaka. No stirring in circles.', () => {
      whiskStep(p, 'bowl', 3000, (acc) => {
        remember('{点|た}てる', 'to whisk (tea)');
        const pct = Math.round(acc * 100);
        const [ok, say, body] = acc >= .85
          ? [true, 'お{見事|みごと}。きめ{細|こま}かい{泡|あわ}どすなぁ。', 'Fast, straight strokes along the W: tiny even bubbles.']
          : acc >= .65 ? [true, 'ええ{泡|あわ}が{立|た}ってますなぁ。', 'A good froth. Stay closer to the W and the bubbles get finer.']
            : [null, '{泡|あわ}が、ちょっと{元気|げんき}どすなぁ。', '"Lively bubbles" is a soft way of saying they\'re coarse: the whisk wandered off the W.'];
        fb(p, ok, `${ok ? '○' : '△'} accuracy ${pct}%`, body, say);
        goBtn(p, 'Now her latte ▶', next);
      });
    }));
  },

  base() {
    const p = panel(); lead(p, "STAGE 4 · Ayano's latte — a strong base");
    S.cup = freshCup();
    p.appendChild(dialog('あやの', 'ラテのは、お{湯|ゆ}{少|すく}なめで{濃|こ}いめにな。', 'For the latte, less water, so it comes out strong.', () => {
      const two = () => { S.scoop = { t: 0, done: () => { S.cup.piles.push({ x: S.cup.piles.length ? 7 : -7, y: 0, s: 20, k: S.cup.piles.length * 2 }); SFX.scoop(); if (S.cup.piles.length < 2) two(); else water(); } }; };
      const water = () => pourStep(p, { into: 'cup', lo: 30, hi: 45, max: 70, rate: 16,
        over: ['あら、ラテが{薄|うす}うなりますえ。', 'Too much water and the milk will drown the matcha. Pour it again.'],
        how: 'The scoops went in for you. Drag the water pitcher over the cup: about 40 ml this time (よんじゅうミリ).',
        then: () => { p.querySelector('.fb')?.remove(); p.querySelector('.meter')?.remove(); whiskStep(p, 'cup', 1400, () => { fb(p, true, '○ ready for milk', 'A thick, smooth base keeps its colour under the milk.'); goBtn(p, 'Pour the milk ▶', next); }); } });
      two();
    }));
  },

  art() {
    const p = panel(); lead(p, 'STAGE 5 · <span lang="ja">ラテアート</span> — draw a heart');
    const c = S.cup; Object.assign(c, { milk: 0, dot: 0, cut: null, art: null }); S.artPhase = 'fill';
    demo(arc(TOOLS.pitcher, { x: CUP.x, y: CUP.y }, 30));
    const how = fb(p, null, 'Pour from high', 'Drag the milk pitcher over the cup and keep your finger down. From up high the milk sinks under the matcha and fills the cup.');
    const pts = artPath(), spiralEnd = ART.n, tol = 15;
    let prog = 0, hit = 0, miss = 0, recent = [], hintAt = 0, last = null, show = null;
    const startTrace = () => {
      S.artPhase = 'trace'; SFX.blip();
      how.innerHTML = '<b>Follow the dashed line</b>Bring the pitcher low and pour along it: start at the dot in the middle, spiral out, then pull straight up through the middle and past the top.';
      show = meter(p, null, null, 1); show(0, 'accuracy 100%');
    };
    /* one drag, scored like the whisk: accuracy is how much of the pitcher's
       travel stayed near the dashed line. Progress only moves forward along
       the line, a few points at a time, so the spiral's rings can't be skipped.
       Lifting the finger just pauses. */
    S.hold = { tool: 'pitcher', hint: true, grab: 70,
      start(d) { S.hold.anywhere = true; S.hold.hint = false; d.style = S.artPhase === 'fill' ? 'high' : 'low'; last = null; },
      tick(dt, d) {
        if (S.artPhase === 'fill') {
          d.style = 'high'; d.pouring = vesselAt(d, 'cup');
          if (d.pouring) { c.milk = Math.min(.8, c.milk + dt * .22); pourSound(d, dt); if (c.milk >= .8) startTrace(); }
          return;
        }
        if (S.artPhase !== 'trace') return;
        d.style = prog > spiralEnd ? 'cut' : 'low';
        d.pouring = vesselAt(d, 'cup');
        if (!d.pouring) { last = null; return; }
        pourSound(d, dt);
        if (!last) { last = { x: d.x, y: d.y }; return; }
        const dist = Math.hypot(d.x - last.x, d.y - last.y); last = { x: d.x, y: d.y };
        if (dist < .5) return;
        const near = distToPath(d, pts) < tol;
        if (prog || near) { if (near) hit += dist; else miss += dist; }
        recent.push([near, dist]); if (recent.length > 40) recent.shift();
        for (let i = Math.min(pts.length - 1, prog + 6); i > prog; i--) if (Math.hypot(d.x - pts[i].x, d.y - pts[i].y) < tol * 1.4) { prog = i; break; }
        const acc = hit + miss ? hit / (hit + miss) : 1;
        show(prog / (pts.length - 1), 'accuracy ' + Math.round(acc * 100) + '%');
        c.dot = 8 + (ART.R - 8) * Math.min(prog, spiralEnd) / spiralEnd;
        if (prog > spiralEnd) {                                           // the pull-through draws the line it leaves
          if (!c.cut) c.cut = [{ x: CUP.x, y: CUP.y + ART.R }];
          c.cut.push({ x: d.x, y: d.y });
        }
        const rd = recent.reduce((s, [, x]) => s + x, 0), rh = recent.reduce((s, [n, x]) => s + (n ? x : 0), 0);
        if (rd > 200 && rh / rd < .45 && performance.now() - hintAt > 4500) { hintAt = performance.now(); tip('{点線|てんせん}のとおりに{注|そそ}いでな', 'Pour along the dashed line', 2600); }
        if (prog >= pts.length - 1) { S.drag = null; judge(acc); }
      } };
    const judge = (acc) => {
      S.hold = null; S.artPhase = 'done'; how.remove(); p.querySelector('.meter')?.remove();
      const ok = acc >= .6;
      c.art = { off: ok ? (1 - acc) * 10 : 18 }; c.cut = null;
      later(() => result(ok, acc), 500);
    };
    const result = (ok, acc) => {
      const pct = Math.round(acc * 100) + '%';
      if (ok) {
        SFX.chime(); remember('{可愛|かわい}らしい', 'lovely, sweet');
        fb(p, true, '○ a heart! · accuracy ' + pct, acc >= .85 ? 'Right along the line: a clean, even heart. The point faces Ayano, so it is the right way up for her.' : 'A heart, a little uneven where the pour wandered off the line. The point faces Ayano.', acc >= .85 ? 'わぁ、ハートや！{可愛|かわい}らしいなぁ。{飲|の}むのもったいないわぁ。' : 'ハートやね。{可愛|かわい}らしいわぁ。');
        unlock(() => goBtn(p, 'Hand it to her ▶', next));
        return;
      }
      S.tries++;
      fb(p, false, '× not quite a heart · accuracy ' + pct, '"What a distinctive pattern" is Kyoto for "that isn\'t quite it". The pour wandered off the dashed line too often. Slower is fine: follow it closely.', 'まぁ、{個性的|こせいてき}な{模様|もよう}どすなぁ。');
      remember('{個性的|こせいてき}どすなぁ', '"How distinctive" — a soft Kyoto way of saying it missed');
      if (S.tries < 2) {
        const again = document.createElement('div'); again.className = 'acts'; p.appendChild(again);
        const one = document.createElement('button'); one.className = 'go'; one.innerHTML = 'Try once more'; one.onclick = () => { SFX.click(); go('art'); };
        const on = document.createElement('button'); on.className = 'go ghost'; on.innerHTML = 'Serve it as it is'; on.onclick = () => { SFX.click(); next(); };
        again.append(one, on);
      } else {
        p.appendChild(dialog('あやの', 'ふふ、これはこれで、うちだけのラテどすな。', 'Hehe. Well, this makes it a latte only I have.', () => goBtn(p, 'Hand it to her ▶', next)));
      }
    };
  },

  serve() {
    const p = panel(); lead(p, 'STAGE 6 · Hand Ayano her latte');
    S.labels = {};
    p.appendChild(dialog('あやの', 'わぁ、ええ{香|かお}り。', 'Oh, it smells lovely.', () => choices(p, [
      { jp: 'はい、どうぞ。{熱|あつ}いから{気|き}をつけてね。', en: "Here you go. Careful, it's hot.", ok: true, reply: 'おおきに。ほな、いただきます。', fb: 'Easy and caring, the way you would hand a friend a drink.' },
      { jp: 'お{召|め}し{上|あ}がりくださいませ。', en: 'Please enjoy (waiter-style).', ok: false, reply: 'あら、{店員|てんいん}さんみたいやわぁ。', fb: 'That is the staff\'s line. At the same table as a friend, it sounds like you work here.' },
      { jp: '{早|はや}く{飲|の}んで！{感想|かんそう}{聞|き}かせて！', en: 'Drink it, quick! Tell me what you think!', ok: false, reply: 'そない{急|せ}かさんといて〜。', fb: 'Rushing her to drink and rate it puts her on the spot. Let her enjoy it at her pace.' },
    ], () => goBtn(p, 'Next ▶', next))));
  },

  end() {
    const p = panel();
    talk(p, [['あやの', 'ええお{茶|ちゃ}の{時間|じかん}どしたなぁ。おおきに。', 'That was a lovely tea time. Thank you.']], () => {
      const t = document.createElement('div'); t.className = 'title'; t.innerHTML = rb('{抹茶|まっちゃ}、いただきます'); t.lang = 'ja'; p.appendChild(t);
      const a = document.createElement('div'); a.className = 'fb ' + (S.got ? '' : 'info');
      a.innerHTML = S.got ? `<b>Achievement</b><span class="say-ja" lang="ja">${rb('ラテを{飲|の}むあやの')}</span>Unlocked with your heart.` : '<b>Achievement</b>Draw a heart in her latte to unlock “Ayano with her latte”.';
      p.appendChild(a);
      const ph = document.createElement('div'); ph.className = 'phr';
      ph.innerHTML = '<b>Words from the tea house</b>' + S.said.map((x) => `<div><div class="j" lang="ja">${rb(x.jp)}</div><div class="k">${esc(x.en)}</div></div>`).join('');
      p.appendChild(ph);
      goBtn(p, 'Play again', () => { Object.assign(S, { tries: 0, got: false, said: [], labels: {}, bowl: freshBowl(), cup: freshCup() }); go('intro'); }, 'ghost');
    });
  },
};

function pourSound(d, dt) { d.acc = (d.acc || 0) + dt; if (d.acc > .16) { d.acc = 0; SFX.pour(); } }
/* pouring water: drag the pitcher over the vessel; it pours while it's there */
function pourStep(p, o) {
  const v = o.into === 'cup' ? S.cup : S.bowl;
  const info = fb(p, null, 'Pour', o.how);
  const into = o.into === 'cup' ? CUP : BOWL; demo(arc(TOOLS.yuzamashi, { x: into.x + 10, y: into.y - 10 }, 50));
  const show = meter(p, o.lo, o.hi, o.max); show(v.water, `${Math.round(v.water)} ml`);
  S.hold = { tool: 'yuzamashi', hint: true, grab: 70,
    start() { p.querySelector('.fb.no')?.remove(); },
    tick(dt, d) {
      d.pouring = vesselAt(d, o.into) && v.water < o.max;
      if (!d.pouring) return;
      v.water = Math.min(o.max, v.water + dt * o.rate); pourSound(d, dt);
      show(v.water, `${Math.round(v.water)} ml`, v.water > o.hi);
    },
    release() {
      if (!v.water) return;
      if (v.water > o.hi) { SFX.ng(); fb(p, false, '× too much', o.over[1], o.over[0]); v.water = 0; show(0, '0 ml'); }
      else if (v.water >= o.lo) { SFX.ok(); S.hold = null; info.remove(); fb(p, true, `○ ${Math.round(v.water)} ml`, 'Just right.'); o.then ? later(o.then, 700) : goBtn(p, 'Whisk it ▶', next); }
      else show(v.water, `${Math.round(v.water)} ml · a little more`);
    } };
}

/* whisking along the dashed W. Accuracy is how much of the whisk's travel
   stayed near the W; froth only rises from travel near it, faster for quick
   strokes. Ayano speaks up when the whisk keeps wandering off. */
function whiskStep(p, into, goal, done) {
  const v = into === 'cup' ? S.cup : S.bowl; v.foam = 0; v.acc = 1;
  const show = meter(p, null, null, 1); show(0, 'froth 0%');
  fb(p, null, 'Whisk', 'Pick up the whisk anywhere and follow the dashed W across the tea, back and forth, quickly. Keys: ← → in turn.');
  const w = { into, goal, hit: 0, miss: 0, recent: [], hintAt: 0, swishAt: 0, show, finish: () => { S.mode = null; S.hold = null; S.drag = null; done(v.acc); } };
  S.whisk = w; S.mode = 'whisk';
  demo(arc(TOOLS.chasen, wPath(into)[0], 40));
  S.hold = { tool: 'chasen', anywhere: true,
    start(d) { d.lx = d.x; d.ly = d.y; d.lt = performance.now(); },
    move(d) {
      const now = performance.now(), dist = Math.hypot(d.x - d.lx, d.y - d.ly), secs = Math.max(.008, (now - d.lt) / 1000);
      d.lx = d.x; d.ly = d.y; d.lt = now;
      if (dist < .5) return;
      const t = into === 'cup' ? CUP : BOWL;
      const near = distToPath(d, wPath(into)) < Math.max(16, t.ri * .17);
      if (near) w.hit += dist; else w.miss += dist;
      w.recent.push([near, dist]); if (w.recent.length > 40) w.recent.shift();
      v.acc = w.hit / (w.hit + w.miss);
      const speed = dist / secs;
      if (now - w.swishAt > 90 && speed > 250) { w.swishAt = now; SFX.swish(); }
      if (near) addFoam(dist / goal * (speed > 500 ? 1 : speed > 220 ? .6 : .3));
      else paintWhisk();
      const rd = w.recent.reduce((s, [, x]) => s + x, 0), rh = w.recent.reduce((s, [n, x]) => s + (n ? x : 0), 0);
      if (rd > 260 && rh / rd < .45 && now - w.hintAt > 4500) { w.hintAt = now; tip('Wの{字|じ}を{描|か}くように{振|ふ}ってな', 'Whisk along the W', 2600); }
    } };
}
function paintWhisk() { const w = S.whisk, v = w.into === 'cup' ? S.cup : S.bowl; w.show(v.foam, `froth ${Math.round(v.foam * 100)}% · accuracy ${Math.round(v.acc * 100)}%`); }
function addFoam(amount) {
  const w = S.whisk, v = w.into === 'cup' ? S.cup : S.bowl;
  v.foam = Math.min(1, v.foam + amount); paintWhisk();
  if (v.foam >= 1 && S.mode === 'whisk') w.finish();
}

/* ===================== input on the table ===================== */
function at(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function hitTool(pt, pad = 0) {
  if (Math.abs(pt.y - TOOLS.chashaku.y) < 22 + pad && Math.abs(pt.x - TOOLS.chashaku.x) < 95 + pad) return 'chashaku';
  for (const k of ['natsume', 'chasen', 'yuzamashi', 'pitcher', 'cup', 'chawan']) { const t = TOOLS[k]; if (Math.hypot(pt.x - t.x, pt.y - t.y) < t.r + pad) return k; }
  return null;
}
let down = false;
cv.addEventListener('pointerdown', (e) => {
  SFX.unlock(); const pt = at(e);
  if (S.mode === 'tools') { S.onTool(hitTool(pt)); return; }
  const h = S.hold; if (!h) return;
  const t = TOOLS[h.tool];
  const grabbed = h.anywhere || (h.tool === 'chashaku' ? hitTool(pt, 30) === 'chashaku' : Math.hypot(pt.x - t.x, pt.y - t.y) < t.r + (h.grab || 30));
  if (!grabbed) return;
  down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* a synthetic pointer */ }
  S.drag = { tool: h.tool, style: h.style, ...pt }; SFX.clack();
  if (S.demo && !S.demo.keep) S.demo = null;
  h.start && h.start(S.drag);
});
cv.addEventListener('pointermove', (e) => {
  if (!down || !S.drag) return;
  Object.assign(S.drag, at(e));
  S.hold && S.hold.move && S.hold.move(S.drag);
});
const up = () => {
  if (!down) return; down = false;
  const d = S.drag, h = S.hold; S.drag = null;
  if (d && h && h.release) h.release(d);
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
let lastKey = '';
addEventListener('keydown', (e) => {
  if (S.mode !== 'whisk' || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  e.preventDefault(); if (e.key === lastKey) return; lastKey = e.key; addFoam(110 / S.whisk.goal);
});

/* ===================== the achievement ===================== */
function unlock(then) {
  S.got = true;
  const snap = document.createElement('canvas'); snap.width = 360; snap.height = 240;
  const sx = cv.width / W, sy = cv.height / H;
  snap.getContext('2d').drawImage(cv, (CUP.x - 150) * sx, (CUP.y - 100) * sy, 300 * sx, 200 * sy, 0, 0, 360, 240);
  const box = document.createElement('div'); box.className = 'ach';
  box.innerHTML = `<div><span class="k">ACHIEVEMENT</span><img alt="Your latte heart" src="${snap.toDataURL('image/png')}"><b lang="ja">${rb('ラテを{飲|の}むあやの')}</b><p>Ayano with her latte. In the app, the illustration of Ayano goes here; for now it is your heart.</p><button class="go">OK</button></div>`;
  document.body.append(box);
  box.querySelector('.go').onclick = () => { SFX.click(); box.remove(); then(); };
  SFX.chime();
}

/* ===================== start ===================== */
$('mute').onclick = () => { const on = SFX.toggle(); $('mute').textContent = on ? 'ON' : 'OFF'; if (!on && voiceOk) speechSynthesis.cancel(); };
paintWood(); fit(); addEventListener('resize', fit);
requestAnimationFrame(frame);
go('intro');
</script>
</body>
