<title>스마트볼 미니게임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: YUNABI's "Clear Sky" look (src/styles/tokens.css), as in the
   유우키 미니게임: a navy bar, the machine as the picture, then a white
   dialogue card. The machine is a retro Shinsekai smart-ball table drawn on
   canvas: maple board, brass pins, glass marbles. One light look, as the app has. */
:root {
  --canvas: #ffffff;
  --surface: #f4f7fa;
  --line: #dce3ea;
  --line-strong: #7d8995;
  --ink: #15202b;
  --body: #3b4855;
  --muted: #5b6875;
  --navy: #1d3e5c;
  --on-navy-muted: #b9d9ee;
  --primary: #1769aa;
  --primary-pressed: #105688;
  --primary-tint: #e6f3fc;
  --mist: #c9e9fb;
  --lantern: #c2372f;
  --ok-bg: #e3f4e1;
  --ok-fg: #1e5b22;
  --hm-bg: #fde8e6;
  --hm-fg: #a3241b;
  --gold: #e9a23b;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  --f-en: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: linear-gradient(180deg, var(--mist) 0, var(--surface) 280px);
  color: var(--body); font: 16px/1.55 var(--f-en);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
}
:lang(ja) { font-family: var(--f-ja); }
.game { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }

.hud { display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; border-radius: var(--r-l); padding: 8px 10px; }
.chip { margin-right: auto; font: 600 14px/1 var(--f-en); color: var(--on-navy-muted); background: #ffffff14; border-radius: 999px; padding: 7px 10px; white-space: nowrap; }
.mute { min-width: 44px; height: 36px; border-radius: 999px; border: 1px solid #ffffff44; background: transparent; color: #fff; cursor: pointer; font: 600 13px/1 var(--f-en); flex: none; }

/* the two players: totals and balls left */
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.side { background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; }
.side.now { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-tint); }
.side b { font: 700 14px/1.4 var(--f-ja); color: var(--ink); }
.side .pts { grid-row: span 2; font: 800 28px/1 var(--f-en); color: var(--navy); font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 4px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #cfd8e0 70%); border: 1px solid var(--line-strong); }
.pips i.used { background: var(--line); border-color: var(--line); }

.stage { position: relative; padding: 6px 0; max-width: 100%; border-radius: var(--r-l); overflow: hidden; background: #3a2416; box-shadow: 0 1px 0 var(--line), 0 8px 24px #1d3e5c22; touch-action: none; }
#board { display: block; margin: 0 auto; height: min(58vh, 560px); width: auto; max-width: 100%; aspect-ratio: 300 / 470; }

.panel { display: grid; gap: 10px; }
.dlg { position: relative; background: var(--canvas); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px 16px 12px; min-height: 96px; box-shadow: 0 2px 8px #1d3e5c14; }
.dlg .name { position: absolute; top: -12px; left: 14px; background: var(--navy); color: #fff; border-radius: 999px; padding: 2px 12px; font: 700 13px/1.6 var(--f-ja); }
.dlg .jp { font: 700 20px/2 var(--f-ja); color: var(--ink); }
.dlg .jp rt { font: 500 10px/1 var(--f-ja); color: var(--muted); }
.dlg .en { font-size: 15px; color: var(--muted); }
.dlg .say { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--primary-tint); color: var(--primary); cursor: pointer; font: 12px/1 var(--f-en); }

.howto { font-size: 15px; color: var(--muted); text-align: center; text-wrap: balance; }
.go { justify-self: center; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; cursor: pointer; font: 700 16px/1 var(--f-en); color: #fff; background: var(--primary); box-shadow: 0 3px 10px #1769aa44; user-select: none; -webkit-user-select: none; touch-action: none; }
.go:hover { background: var(--primary-pressed); }
.go:active { transform: translateY(1px); }
.go[disabled] { background: var(--line-strong); box-shadow: none; cursor: default; }
.go.red { background: var(--lantern); box-shadow: 0 3px 10px #c2372f44; min-width: 220px; }
.go.red.held { background: #9e2a23; }
.go:focus-visible, .mute:focus-visible, .say:focus-visible, .seg button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.fb { border-radius: var(--r-m); padding: 10px 14px; font-size: 15px; background: var(--primary-tint); color: #0f4c7a; }
.fb.ok { background: var(--ok-bg); color: var(--ok-fg); }
.fb.no { background: var(--hm-bg); color: var(--hm-fg); }
.fb b { display: block; font: 700 16px/1.5 var(--f-en); }

/* the achievement illustration the bet unlocks (a placeholder until it is drawn) */
.ach { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--canvas); border: 1px solid var(--gold); border-radius: var(--r-m); padding: 10px 12px; }
.ach .pic { aspect-ratio: 1; border-radius: var(--r-s); background: repeating-linear-gradient(45deg, #fdf3e2 0 8px, #f8e6c6 8px 16px); display: grid; place-items: center; font: 700 22px/1 var(--f-ja); color: #8a5a12; }
.ach small { display: block; font: 700 12px/1.4 var(--f-en); letter-spacing: .06em; text-transform: uppercase; color: #8a5a12; }
.ach b { font: 700 17px/1.5 var(--f-ja); color: var(--ink); }
.ach p { margin: 0; font-size: 14px; color: var(--muted); }

/* prototype only: which reply was picked in scene 6 */
.proto { border-top: 1px dashed var(--line-strong); padding-top: 10px; display: grid; gap: 6px; }
.proto > span { font: 600 12px/1.4 var(--f-en); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; gap: 6px; }
.seg button { text-align: left; min-height: 40px; padding: 6px 12px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--canvas); color: var(--ink); cursor: pointer; font: 600 15px/1.5 var(--f-ja); }
.seg button small { font: 500 13px/1 var(--f-en); color: var(--muted); margin-left: 6px; }
.seg button[aria-pressed="true"] { background: var(--primary-tint); border-color: var(--primary); }

/* the two flipper buttons, under your thumbs */
/* the control deck: an arcade cabinet's panel with domed push buttons */
.deck { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding: 16px 12px 10px; border-radius: var(--r-l); background: linear-gradient(180deg, #24435f, #16304a); box-shadow: inset 0 2px 0 #ffffff1a, 0 6px 0 #0d2133; }
.slot { display: grid; justify-items: center; gap: 8px; }
.slot > span { font: 800 11px/1 var(--f-en); letter-spacing: .14em; color: var(--on-navy-muted); }
.arc {
  --cap: #e2463c; --cap-dark: #8f1f18;
  position: relative; width: 84px; height: 84px; border: 0; padding: 0; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle closest-side, #10181f 0 72%, #eef1f4 75%, #9aa5af 87%, #2a333c 100%);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.arc::before {
  content: ""; position: absolute; inset: 13px; border-radius: 50%;
  background: radial-gradient(circle at 36% 28%, #ffffffb0 0 9%, transparent 24%), radial-gradient(circle at 50% 62%, var(--cap) 0 52%, var(--cap-dark) 100%);
  box-shadow: 0 6px 0 var(--cap-dark), 0 9px 10px #00000066;
  transform: translateY(-6px); transition: transform .05s, box-shadow .05s;
}
.arc.held::before { transform: translateY(0); box-shadow: 0 1px 0 var(--cap-dark), 0 2px 4px #00000066; }
.arc.gold { --cap: #f2b440; --cap-dark: #a66a0e; width: 70px; height: 70px; }
.arc.gold::before { inset: 11px; }
.arc[disabled] { cursor: default; }
.arc[disabled]::before { filter: grayscale(.8) brightness(.65); }
.arc:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.keys { font-size: 13px; color: var(--muted); text-align: center; }
</style>

<div class="game">
  <div class="hud">
    <span class="chip" id="chip">Smart-ball · Shinsekai</span>
    <button class="mute" id="mute" type="button" aria-pressed="false">Sound on</button>
  </div>

  <div class="score">
    <div class="side" id="sideMe"><b lang="ja">あなた</b><span class="pts" id="ptsMe">0</span><span class="pips" id="pipsMe"></span></div>
    <div class="side" id="sideYuki"><b lang="ja">ユウキ</b><span class="pts" id="ptsYuki">0</span><span class="pips" id="pipsYuki"></span></div>
  </div>

  <div class="stage"><canvas id="board" width="300" height="470" aria-label="Smart-ball table with two flippers"></canvas></div>

  <div class="panel" id="panel">
    <div id="ctl" class="panel"></div>
    <div class="dlg">
      <span class="name" lang="ja">ユウキ</span>
      <button class="say" id="say" type="button" aria-label="Play Yuki's line">▶</button>
      <div class="jp" lang="ja" id="jp"></div>
      <div class="en" id="en"></div>
    </div>
  </div>

  <div class="proto">
    <span>Prototype: your reply in scene 6</span>
    <div class="seg" id="bet">
      <button type="button" data-bet="juice" aria-pressed="true" lang="ja">よっしゃ、受けて立つで！<small>juice</small></button>
      <button type="button" data-bet="takoyaki" aria-pressed="false" lang="ja">ほな、ジュースやなくてたこ焼きにしよ！<small>takoyaki</small></button>
      <button type="button" data-bet="none" aria-pressed="false" lang="ja">え、お金賭けるのはちょっと……<small>no bet</small></button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ---------- lines (furigana as {漢字|かな}, as in the app) ---------- */
const LINES = {
  intro: ['ほな、{先攻|せんこう}どうぞ。{一人|ひとり}{三球|さんきゅう}な！', 'You go first. Three balls each!'],
  weak: ['もうちょい{強|つよ}く{引|ひ}いてみ！', 'Pull it back a bit harder!'],
  meBig: ['うわ、やるやん！', 'Whoa, nice one!'],
  meSmall: ['お、{入|はい}った入った！', 'Oh, that went in!'],
  meOut: ['あ〜、{落|お}ちてもうた！', 'Aw, it dropped!'],
  yukiTurn: ['よっしゃ、{俺|おれ}の{番|ばん}や。', 'Right, my turn.'],
  yukiBig: ['{見|み}たか！', 'Did you see that?!'],
  yukiDrainBig: ['あ〜、もうちょい{粘|ねば}りたかったわ……', 'Aw, I wanted to keep that one going a bit longer...'],
  yukiSmall: ['まあまあやな。', 'Not bad.'],
  yukiOut: ['なんでやねん！', 'Oh, come on!'],
  tie: ['{同点|どうてん}やん！もう{一球|いっきゅう}ずつ！', "We're tied! One more ball each!"],
  practice: ['せやな、さっきのは{練習|れんしゅう}やったもんな？ほな、ここからが{本番|ほんばん}や！', "Right, that one was just practice, wasn't it? Okay, this one's for real!"],
  win: ['えーっ！！もう{一回|いっかい}！……いや、わかったわかった、{俺|おれ}の{負|ま}けや。しゃあないな、おごったるわ', "Nooo! One more round! ...No, okay, okay, I lost. Fine, it's on me."],
  lose: ['よっしゃー！{俺|おれ}の{勝|か}ちや！ごちそうさまで〜す', "Yes! I win! Thanks for the treat~"],
};
const BALLS = 3;
const BALL_TIME = 40;     // seconds a ball may stay up before the flippers go dark
const BETS = {
  juice: { name: 'ジュース', note: 'The juice bet, settled at the smart-ball table.' },
  takoyaki: { name: 'たこ焼き', note: 'You raised the bet to takoyaki, Osaka style.' },
};

/* ---------- small DOM helpers: text only, never HTML ---------- */
const $ = (id) => document.getElementById(id);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  for (const k of kids) e.append(k);
  return e;
}
function ruby(text) {
  const frag = document.createDocumentFragment();
  const re = /\{([^|}]+)\|([^}]+)\}/g;
  let i = 0, m;
  while ((m = re.exec(text))) {
    frag.append(text.slice(i, m.index));
    const r = el('ruby', {}, m[1]);
    r.append(el('rt', {}, m[2]));
    frag.append(r);
    i = re.lastIndex;
  }
  frag.append(text.slice(i));
  return frag;
}
const plain = (t) => t.replace(/\{([^|}]+)\|[^}]+\}/g, '$1');

/* ---------- sound: a few WebAudio blips, started by a tap ---------- */
let muted = false, ac = null;
function audio() {
  if (muted) return null;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type = 'sine', vol = 0.15, when = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
let lastTick = 0;
const sfx = {
  pin(force) { const n = performance.now(); if (n - lastTick < 35) return; lastTick = n; tone(2100 + Math.random() * 500, 0.04, 'triangle', Math.min(0.12, force / 3000)); },
  shoot() { tone(180, 0.12, 'square', 0.08); tone(90, 0.18, 'sine', 0.12); },
  hole(v) { const base = v >= 10 ? 880 : v >= 5 ? 740 : 620; tone(base, 0.12, 'triangle', 0.14); tone(base * 1.5, 0.22, 'triangle', 0.12, 0.09); if (v >= 10) tone(base * 2, 0.3, 'triangle', 0.1, 0.2); },
  bump() { tone(520, 0.08, 'square', 0.07); tone(780, 0.1, 'triangle', 0.08, 0.03); },
  flip() { tone(240, 0.05, 'square', 0.05); },
  out() { tone(140, 0.25, 'sine', 0.12); },
};
function speak(text) {
  if (muted || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    u.lang = 'ja-JP'; u.rate = 1.05; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch {}
}

/* ---------- the table ---------- */
const W = 300, H = 470;
const R = 7;                       // marble radius
const G = 520;                     // gravity along the tilted table, px/s²
const ARC = { x: 150, y: 160, r: 142 };
const LANE_X = 276, RIGHT_X = 292, LANE_TOP = 178;
const PLUNGER_Y = H - 24;          // where a marble rests on the plunger
const DRAIN_Y = H - 12;
/* numbered holes: a marble that rolls in scores the number and is kicked back out */
const HOLES = [
  { x: 142, y: 128, v: 3 },
  { x: 62, y: 214, v: 5 }, { x: 222, y: 214, v: 5 },
  { x: 142, y: 286, v: 10 },
  { x: 36, y: 300, v: 3 }, { x: 248, y: 300, v: 3 },
];
const BUMPERS = [
  { x: 102, y: 168, r: 13 }, { x: 182, y: 168, r: 13 }, { x: 142, y: 222, r: 13 },
].map((b) => ({ ...b, lit: 0 }));
const segs = [];
const seg = (x1, y1, x2, y2) => segs.push({ x1, y1, x2, y2 });
(function walls() {
  seg(8, ARC.y, 8, H - 132);
  const n = 48;
  for (let i = 0; i < n; i++) {
    const a1 = Math.PI - (Math.PI * i) / n, a2 = Math.PI - (Math.PI * (i + 1)) / n;
    seg(ARC.x + ARC.r * Math.cos(a1), ARC.y - ARC.r * Math.sin(a1), ARC.x + ARC.r * Math.cos(a2), ARC.y - ARC.r * Math.sin(a2));
  }
  seg(RIGHT_X, ARC.y, RIGHT_X, H);
  seg(LANE_X, LANE_TOP, LANE_X, H);
  seg(LANE_X, PLUNGER_Y + R, RIGHT_X, PLUNGER_Y + R);
  /* the slopes that feed the flippers */
  seg(8, H - 132, 62, H - 70);
  seg(LANE_X, H - 132, 222, H - 70);
})();
const pins = [];
(function pinField() {
  /* a few rows of brass pins, as on a smart-ball table */
  for (let row = 0, y = 92; y < 340; row++, y += 34) {
    for (let x = 30 + (row % 2) * 22; x < LANE_X - 16; x += 44) {
      if (HOLES.some((h) => Math.hypot(h.x - x, h.y - y) < 26)) continue;
      if (BUMPERS.some((b) => Math.hypot(b.x - x, b.y - y) < b.r + 18)) continue;
      if (y < ARC.y && Math.hypot(x - ARC.x, y - ARC.y) > ARC.r - 20) continue;
      pins.push({ x, y, r: 2.4 });
    }
  }
})();
/* flippers: angle 0 points right, y grows downwards */
const FLIP_LEN = 58;
const flips = {
  left: { px: 62, py: H - 70, rest: 0.5, up: -0.45, ang: 0.5, w: 0, held: false },
  right: { px: 222, py: H - 70, rest: Math.PI - 0.5, up: Math.PI + 0.45, ang: Math.PI - 0.5, w: 0, held: false },
};

/* ---------- physics ---------- */
let ball = null;
const pops = [];
let scoreBall = 0;        // what the marble in play has scored so far
function pushOut(b, cx, cy, rad, e, svx = 0, svy = 0) {
  let nx = b.x - cx, ny = b.y - cy;
  const d = Math.hypot(nx, ny), min = R + rad;
  if (d >= min || d === 0) return null;
  nx /= d; ny /= d;
  b.x = cx + nx * min; b.y = cy + ny * min;
  const vn = (b.vx - svx) * nx + (b.vy - svy) * ny;
  if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
  return { nx, ny, vn };
}
function closest(b, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const t = Math.max(0, Math.min(1, ((b.x - x1) * dx + (b.y - y1) * dy) / (dx * dx + dy * dy)));
  return [x1 + t * dx, y1 + t * dy];
}
function moveFlippers(dt) {
  for (const f of Object.values(flips)) {
    const dark = ball && ball.t > BALL_TIME;
    const target = f.held && !dark ? f.up : f.rest;
    const speed = f.held ? 22 : 12;
    const before = f.ang;
    const d = target - f.ang;
    f.ang += Math.sign(d) * Math.min(Math.abs(d), speed * dt);
    f.w = (f.ang - before) / dt;
  }
}
function step(dt) {
  const b = ball;
  moveFlippers(dt);
  if (b.state === 'held') {
    b.hold -= dt;
    if (b.hold <= 0) { b.state = 'flying'; b.vx = (Math.random() - 0.5) * 300; b.vy = 120; b.cool = 0.5; }
    return;
  }
  b.t += dt;
  b.cool = Math.max(0, b.cool - dt);
  b.vy += G * dt;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 1200) { b.vx *= 1200 / sp; b.vy *= 1200 / sp; }
  b.x += b.vx * dt; b.y += b.vy * dt;
  for (const s of segs) { const [cx, cy] = closest(b, s.x1, s.y1, s.x2, s.y2); pushOut(b, cx, cy, 0, 0.3); }
  for (const p of pins) { const hit = pushOut(b, p.x, p.y, p.r, 0.55); if (hit) sfx.pin(-hit.vn); }
  for (const k of BUMPERS) {
    const hit = pushOut(b, k.x, k.y, k.r, 0.6);
    if (hit && hit.vn < -40) {
      b.vx += hit.nx * 260; b.vy += hit.ny * 260;
      k.lit = 0.25; score(1, k.x, k.y - 20); sfx.bump();
    }
  }
  for (const f of Object.values(flips)) {
    const tx = f.px + FLIP_LEN * Math.cos(f.ang), ty = f.py + FLIP_LEN * Math.sin(f.ang);
    const [cx, cy] = closest(b, f.px, f.py, tx, ty);
    /* the flipper's own speed where the marble touches it */
    const svx = -f.w * (cy - f.py), svy = f.w * (cx - f.px);
    const hit = pushOut(b, cx, cy, 5, 0.35, svx, svy);
    if (hit && Math.abs(f.w) > 1 && hit.vn < -200) sfx.flip();
  }
  if (b.x < LANE_X - 6) b.left = true;
  /* a one-way gate: once the marble is on the table, the launch lane is shut */
  if (b.left && b.x > LANE_X - R) { b.x = LANE_X - R; if (b.vx > 0) b.vx = -b.vx * 0.4; }
  if (!b.cool) {
    for (const h of HOLES) {
      if (Math.hypot(b.x - h.x, b.y - h.y) < 11 && Math.hypot(b.vx, b.vy) < 700) {
        b.state = 'held'; b.hold = 0.7; b.x = h.x; b.y = h.y; b.vx = 0; b.vy = 0;
        score(h.v, h.x, h.y - 18); sfx.hole(h.v);
        if (h.v >= 5) say(S.turn === 'me' ? 'meBig' : 'yukiBig');
        return;
      }
    }
  }
  if (b.x < LANE_X && b.y > DRAIN_Y) return drain();
  /* not strong enough to clear the arc: it rolls back onto the plunger */
  if (b.x > LANE_X && b.y >= PLUNGER_Y - 1 && b.t > 0.3) return b.left ? drain() : rollBack();
  /* resting on a pin top: a nudge, as you would knock the glass */
  if (Math.hypot(b.vx, b.vy) < 8) { b.still += dt; if (b.still > 1.2) { b.vx = (Math.random() - 0.5) * 140; b.vy = -60; b.still = 0; } }
  else b.still = 0;
  if (S.turn === 'yuki') yukiFlips(dt);
}
function score(v, x, y) {
  scoreBall += v;
  pops.push({ x, y, text: '+' + v, t: 0 });
  renderScore();
}

/* ---------- the match ---------- */
const S = { phase: 'intro', turn: 'me', me: [], yuki: [], extra: 0, power: 0, charging: false, chargeT: 0, bet: 'juice', rematch: false };
const played = (who) => S[who].length;
const total = (who) => S[who].reduce((a, b) => a + b, 0) + (S.phase === 'play' && S.turn === who && ball ? scoreBall : 0);
const limit = () => BALLS + S.extra;

function say(key) {
  const [jp, en] = LINES[key];
  const box = $('jp'); box.textContent = ''; box.append(ruby(jp));
  $('en').textContent = en;
  $('say').onclick = () => speak(jp);
  speak(jp);
}
function renderScore() {
  for (const who of ['me', 'yuki']) {
    const id = who === 'me' ? 'Me' : 'Yuki';
    $('pts' + id).textContent = String(total(who));
    const pips = $('pips' + id); pips.textContent = '';
    for (let i = 0; i < limit(); i++) pips.append(el('i', { className: i < played(who) ? 'used' : '' }));
    $('side' + id).classList.toggle('now', S.phase === 'play' && S.turn === who);
  }
  $('chip').textContent = S.phase === 'play'
    ? `Ball ${Math.min(played(S.turn) + 1, limit())} of ${limit()} · ${S.turn === 'me' ? 'Your turn' : "Yuki's turn"}`
    : 'Smart-ball · Shinsekai';
}
function holdButton(b, on, off) {
  const down = (e) => { e.preventDefault(); b.classList.add('held'); on(); };
  const up = (e) => { e.preventDefault(); if (b.classList.contains('held')) { b.classList.remove('held'); off(); } };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
}
function controls() {
  const c = $('ctl'); c.textContent = '';
  if (S.phase === 'intro') {
    c.append(el('p', { className: 'howto', textContent: 'Hold the plunger and let go to launch the marble. Keep it on the table with the two flippers. A numbered hole scores its number, a bumper scores 1. Three balls each; the higher total wins.' }));
    const b = el('button', { className: 'go', type: 'button', textContent: S.rematch ? 'Start the rematch' : 'Start the match' });
    b.onclick = () => { audio(); S.phase = 'play'; S.turn = 'me'; nextBall(); };
    c.append(b);
  } else if (S.phase === 'play') {
    /* the same three buttons all match long: each lights up when it can be used */
    const mine = S.turn === 'me' && ball;
    const ready = mine && ball.state === 'ready';
    const deck = el('div', { className: 'deck' });
    const slot = (label, b) => deck.append(el('div', { className: 'slot' }, b, el('span', { textContent: label })));
    const flipper = (side) => {
      const b = el('button', { className: 'arc', type: 'button', disabled: !mine || ready });
      b.setAttribute('aria-label', side === 'left' ? 'Left flipper' : 'Right flipper');
      holdButton(b, () => (flips[side].held = true), () => (flips[side].held = false));
      return b;
    };
    const launch = el('button', { className: 'arc gold', type: 'button', disabled: !ready });
    launch.setAttribute('aria-label', 'Hold to pull the plunger, let go to launch');
    holdButton(launch, startCharge, release);
    slot('LEFT', flipper('left'));
    slot('LAUNCH', launch);
    slot('RIGHT', flipper('right'));
    c.append(deck, el('p', { className: 'keys', textContent: !mine ? 'Yuki is playing.'
      : ready ? 'Hold LAUNCH: the gauge rises and falls. Let go when it is where you want it.'
      : 'Flip with LEFT and RIGHT, a tap on either half of the table, or ← →.' }));
  } else if (S.phase === 'end') {
    const won = total('me') > total('yuki');
    c.append(el('div', { className: 'fb ' + (won ? 'ok' : 'no') },
      el('b', { textContent: won ? 'You won!' : 'Yuki won' }),
      `${total('me')} to ${total('yuki')}. ${won ? 'Yuki pays.' : 'You pay.'}`));
    const bet = BETS[S.bet];
    if (bet) {
      const pic = el('div', { className: 'pic' }); pic.lang = 'ja'; pic.textContent = bet.name.slice(0, 2);
      const name = el('b', { textContent: bet.name }); name.lang = 'ja';
      c.append(el('div', { className: 'ach' }, pic,
        el('div', {}, el('small', { textContent: 'Achievement unlocked' }), name, el('p', { textContent: bet.note + ' The same picture whoever wins.' }))));
    } else {
      c.append(el('p', { className: 'howto', textContent: 'No achievement: you turned down the bet in scene 6.' }));
    }
    /* one rematch only: Yuki calls the first one practice, the second one counts */
    if (!S.rematch) {
      const again = el('button', { className: 'go', type: 'button', textContent: 'Play again (once)' });
      again.onclick = () => { Object.assign(S, { phase: 'intro', me: [], yuki: [], extra: 0, rematch: true }); ball = null; say('practice'); renderScore(); controls(); };
      c.append(again);
    } else {
      c.append(el('p', { className: 'howto', textContent: 'That was the rematch. The result stands.' }));
    }
  }
}
function nextBall() {
  /* one ball each in turn; the match ends when both have played them all */
  if (played('me') >= limit() && played('yuki') >= limit()) return endMatch();
  ball = { x: (LANE_X + RIGHT_X) / 2, y: PLUNGER_Y, vx: 0, vy: 0, left: false, still: 0, t: 0, cool: 0, state: 'ready' };
  scoreBall = 0;
  S.power = 0;
  flips.left.held = flips.right.held = false;
  renderScore();
  controls();
  if (S.turn === 'yuki') yukiLaunches();
}
function startCharge() {
  if (!ball || ball.state !== 'ready') return;
  audio();
  S.charging = true; S.chargeT = 0;
}
function release() {
  if (!S.charging) return;
  S.charging = false;
  ball.state = 'flying';
  ball.vy = -(380 + S.power * 520);
  sfx.shoot();
  controls();
}
function rollBack() {
  ball.vx = 0; ball.vy = 0; ball.y = PLUNGER_Y; ball.state = 'ready'; ball.t = 0;
  S.power = 0;
  if (S.turn === 'me') { say('weak'); controls(); } else yukiLaunches();
}
function drain() {
  ball.state = 'done';
  flips.left.held = flips.right.held = false;
  S[S.turn].push(scoreBall);
  sfx.out();
  const me = S.turn === 'me';
  /* the ball has dropped: Yuki is sorry to lose his, even after a good run */
  say(scoreBall >= 15 ? (me ? 'meBig' : 'yukiDrainBig') : scoreBall > 0 ? (me ? 'meSmall' : 'yukiSmall') : (me ? 'meOut' : 'yukiOut'));
  scoreBall = 0;
  renderScore();
  setTimeout(() => {
    S.turn = S.turn === 'me' ? 'yuki' : 'me';
    if (S.turn === 'yuki' && played('yuki') < limit()) say('yukiTurn');
    nextBall();
  }, 1300);
}
function yukiLaunches() {
  /* Yuki pulls to a power of his own and plays by the same physics */
  const target = 0.35 + Math.random() * 0.6;
  setTimeout(() => {
    if (!ball || ball.state !== 'ready') return;
    S.charging = true; S.chargeT = 0;
    const hold = setInterval(() => {
      if (S.power >= target) { clearInterval(hold); release(); }
    }, 16);
  }, 900);
}
/* Yuki's flipping: he usually catches a marble coming down at a flipper, not always */
const ai = { left: { plan: null, t: 0 }, right: { plan: null, t: 0 } };
function yukiFlips(dt) {
  for (const side of ['left', 'right']) {
    const f = flips[side], a = ai[side];
    const tx = f.px + FLIP_LEN * Math.cos(f.rest), ty = f.py + FLIP_LEN * Math.sin(f.rest);
    const [cx, cy] = closest(ball, f.px, f.py, tx, ty);
    const near = Math.hypot(ball.x - cx, ball.y - cy) < 26 && ball.vy > 0;
    if (near && a.plan === null) a.plan = Math.random() < 0.82;
    if (!near && !f.held) a.plan = null;
    if (near && a.plan && !f.held) { f.held = true; a.t = 0.24; }
    if (f.held) { a.t -= dt; if (a.t <= 0) { f.held = false; a.plan = null; } }
  }
}
function endMatch() {
  if (total('me') === total('yuki')) {
    S.extra += 1; say('tie'); S.turn = 'me';
    return setTimeout(nextBall, 1400);
  }
  S.phase = 'end'; ball = null;
  say(total('me') > total('yuki') ? 'win' : 'lose');
  renderScore(); controls();
}

/* ---------- drawing ---------- */
const cv = $('board'), ctx = cv.getContext('2d');
function fit() {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fit();
addEventListener('resize', fit);
const wood = (() => {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#f0dcb4'); g.addColorStop(0.5, '#e6cc9c'); g.addColorStop(1, '#dcbd88');
  return g;
})();
const jaFont = getComputedStyle(document.documentElement).getPropertyValue('--f-ja');
function draw(dt) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#3a2416'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(8, H); ctx.lineTo(8, ARC.y); ctx.arc(ARC.x, ARC.y, ARC.r, Math.PI, 0); ctx.lineTo(RIGHT_X, H); ctx.closePath();
  ctx.fillStyle = wood; ctx.fill();
  ctx.clip();
  ctx.strokeStyle = '#c9a56c55'; ctx.lineWidth = 1;
  for (let y = 10; y < H; y += 9) { ctx.beginPath(); ctx.moveTo(0, y + Math.sin(y) * 2); ctx.bezierCurveTo(100, y + 4, 200, y - 4, W, y + Math.cos(y) * 2); ctx.stroke(); }
  /* the sign */
  ctx.fillStyle = '#c2372f'; ctx.font = '700 15px ' + jaFont;
  ctx.textAlign = 'center'; ctx.fillText('スマートボール', ARC.x, 58);
  /* below the slopes: the drain */
  ctx.fillStyle = '#5a3a22';
  ctx.beginPath(); ctx.moveTo(8, H - 132); ctx.lineTo(62, H - 70); ctx.lineTo(62, H); ctx.lineTo(8, H); ctx.fill();
  ctx.beginPath(); ctx.moveTo(LANE_X, H - 132); ctx.lineTo(222, H - 70); ctx.lineTo(222, H); ctx.lineTo(LANE_X, H); ctx.fill();
  ctx.fillStyle = '#2a1a0f'; ctx.fillRect(62, DRAIN_Y, 160, H);
  /* holes */
  for (const h of HOLES) {
    ctx.beginPath(); ctx.arc(h.x, h.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = h.v >= 10 ? '#c2372f' : h.v >= 5 ? '#1d3e5c' : '#2c5a46'; ctx.fill();
    ctx.beginPath(); ctx.arc(h.x, h.y, 7, 0, Math.PI * 2); ctx.fillStyle = '#1a0f08'; ctx.fill();
    ctx.fillStyle = '#b45d12'; ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(h.v), h.x, h.y - 15);
  }
  /* bumpers */
  for (const k of BUMPERS) {
    k.lit = Math.max(0, k.lit - dt);
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2);
    ctx.fillStyle = k.lit ? '#ffd27a' : '#c2372f'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff6e0'; ctx.stroke();
    ctx.beginPath(); ctx.arc(k.x, k.y, 5, 0, Math.PI * 2); ctx.fillStyle = '#fff6e0'; ctx.fill();
  }
  /* pins */
  for (const p of pins) {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = '#b8892c'; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x - 0.7, p.y - 0.7, 0.9, 0, Math.PI * 2); ctx.fillStyle = '#ffe9a8'; ctx.fill();
  }
  /* lane and plunger */
  ctx.fillStyle = '#d4b37c'; ctx.fillRect(LANE_X, LANE_TOP, RIGHT_X - LANE_X, H);
  const pull = S.power * 20;
  ctx.fillStyle = '#7d8995'; ctx.fillRect(LANE_X + 3, PLUNGER_Y + R + pull, RIGHT_X - LANE_X - 6, 4);
  ctx.strokeStyle = '#5b6875'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let i = 0; i <= 6; i++) { const yy = PLUNGER_Y + R + 4 + pull + i * ((H - PLUNGER_Y - R - 4 - pull) / 6); ctx.lineTo(i % 2 ? RIGHT_X - 3 : LANE_X + 3, yy); }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2;
  for (const s of segs) { ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
  /* flippers */
  const dark = ball && ball.t > BALL_TIME;
  for (const f of Object.values(flips)) {
    const tx = f.px + FLIP_LEN * Math.cos(f.ang), ty = f.py + FLIP_LEN * Math.sin(f.ang);
    ctx.lineCap = 'round';
    ctx.lineWidth = 12; ctx.strokeStyle = dark ? '#7d8995' : '#1d3e5c';
    ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.lineWidth = 4; ctx.strokeStyle = dark ? '#b9c3cc' : '#c2372f';
    ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.beginPath(); ctx.arc(f.px, f.py, 3, 0, Math.PI * 2); ctx.fillStyle = '#e9a23b'; ctx.fill();
  }
  /* power gauge beside the lane */
  if (ball && ball.state === 'ready') {
    ctx.fillStyle = '#ffffff33'; ctx.fillRect(RIGHT_X + 2, LANE_TOP + 40, 5, 200);
    const h = 200 * S.power;
    ctx.fillStyle = S.power > 0.85 ? '#c2372f' : S.power > 0.4 ? '#e9a23b' : '#8ecdf2';
    ctx.fillRect(RIGHT_X + 2, LANE_TOP + 240 - h, 5, h);
  }
  /* time left on this ball */
  if (ball && ball.state !== 'ready' && S.phase === 'play') {
    const left = Math.max(0, BALL_TIME - ball.t);
    ctx.fillStyle = left < 6 ? '#c2372f' : '#f0dcb4'; ctx.font = '700 11px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(left > 0 ? Math.ceil(left) + 's' : 'TIME', (62 + 222) / 2, H - 2);
  }
  /* the marble */
  if (ball && ball.state !== 'done') {
    const x = ball.x, y = ball.y + (ball.state === 'ready' ? S.power * 20 : 0), r = ball.state === 'held' ? R * 0.8 : R;
    ctx.beginPath(); ctx.arc(x + 1.5, y + 2, r, 0, Math.PI * 2); ctx.fillStyle = '#00000033'; ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, 1, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#e4ecf2'); g.addColorStop(1, '#a9b8c4');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt;
    if (p.t > 1.1) { pops.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
    ctx.font = '800 18px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.strokeText(p.text, p.x, p.y - p.t * 24);
    ctx.fillStyle = '#c2372f'; ctx.fillText(p.text, p.x, p.y - p.t * 24);
    ctx.globalAlpha = 1;
  }
}
let last = performance.now();
const STEP = 1 / 900;
let simLeft = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  /* the gauge rises for a second, falls for a second, and goes on while held */
  if (S.charging) { S.chargeT += dt; const ph = S.chargeT % 2; S.power = ph <= 1 ? ph : 2 - ph; }
  /* fixed small steps, however slow the frame: the marble moves under 1.5 px a
     step, so it can never jump through a wall */
  if (ball && (ball.state === 'flying' || ball.state === 'held')) {
    simLeft += dt;
    while (simLeft >= STEP && ball && (ball.state === 'flying' || ball.state === 'held')) { step(STEP); simLeft -= STEP; }
  } else { simLeft = 0; moveFlippers(dt); }
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- wiring ---------- */
$('mute').onclick = () => {
  muted = !muted;
  $('mute').textContent = muted ? 'Sound off' : 'Sound on';
  $('mute').setAttribute('aria-pressed', String(muted));
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
};
for (const b of document.querySelectorAll('#bet button')) {
  b.onclick = () => {
    S.bet = b.dataset.bet;
    for (const o of document.querySelectorAll('#bet button')) o.setAttribute('aria-pressed', String(o === b));
    if (S.phase === 'end') controls();
  };
}
/* the keyboard: Space pulls the plunger, the arrows (or Z and /) flip */
const myTurn = () => S.phase === 'play' && S.turn === 'me' && ball;
const sideOf = (k) => (k === 'ArrowLeft' || k === 'z' || k === 'Z' ? 'left' : k === 'ArrowRight' || k === '/' ? 'right' : null);
addEventListener('keydown', (e) => {
  if (!myTurn() || e.repeat) return;
  const side = sideOf(e.key);
  if (side) { e.preventDefault(); flips[side].held = true; }
  else if (e.key === ' ' && ball.state === 'ready') { e.preventDefault(); startCharge(); }
});
addEventListener('keyup', (e) => {
  if (!myTurn()) return;
  const side = sideOf(e.key);
  if (side) { e.preventDefault(); flips[side].held = false; }
  else if (e.key === ' ' && S.charging) { e.preventDefault(); release(); }
});
/* tapping the table: the left half flips left, the right half right */
const touching = new Map();
cv.addEventListener('pointerdown', (e) => {
  if (!myTurn() || ball.state === 'ready') return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const side = e.clientX - r.left < r.width / 2 ? 'left' : 'right';
  touching.set(e.pointerId, side); flips[side].held = true;
  try { cv.setPointerCapture(e.pointerId); } catch {}
});
const lift = (e) => { const side = touching.get(e.pointerId); if (side) { flips[side].held = false; touching.delete(e.pointerId); } };
cv.addEventListener('pointerup', lift);
cv.addEventListener('pointercancel', lift);
say('intro');
renderScore();
controls();
</script>
