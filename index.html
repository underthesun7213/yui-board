<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YUI</title>
<meta name="description" content="Everyday Japanese comics and a conversation game, a map of everyday places, and the dorm calendar — for residents of GLOBAL COMMONS 結 -YUI-.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1D3E5C">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YUI">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --washi:#E9EAE5;
  --washi-deep:#DEDFD8;
  --card:#F6F6F3;
  --sumi:#1A1D20;
  --sumi-soft:#5B6167;
  --sumi-faint:#8D9299;
  --ai:#1D3E5C;
  --ai-mid:#3D6A92;
  --asagi:#8FB2C7;
  --beni:#B03A34;
  --line:#C9CBC3;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --col:430px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--washi-deep);
  font-family:var(--sans);
  color:var(--sumi);
  line-height:1.6;
  font-size:15px;
  display:flex;justify-content:center;
  min-height:100dvh;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
}
/* Built for phones. Chrome elements shouldn't be text-selectable on touch. */
header,.tabbar,.bar{-webkit-user-select:none;user-select:none}
/* Hover styles only where a real pointer exists, so taps don't leave stuck states. */
@media(hover:hover){
  .filters{cursor:grab}
  .filters:active{cursor:grabbing}
  .langmenu button:hover,.ev:hover{background:var(--card)}
}
/* Fills the notch / status bar area in iOS standalone mode. */
#statusfill{position:fixed;top:0;left:0;right:0;z-index:60;
  height:env(safe-area-inset-top);background:var(--ai)}
body[data-top="washi"] #statusfill{background:var(--washi)}
#app{
  width:100%;max-width:var(--col);
  background:var(--washi);
  min-height:100vh;
  position:relative;
  box-shadow:0 0 0 1px var(--line);
  display:flex;flex-direction:column;
  padding-bottom:76px;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--ai);
  color:#EDF1F4;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;
}
.crest{display:flex;align-items:flex-end;gap:11px}
.knot{
  font-size:30px;line-height:.9;font-weight:600;
  letter-spacing:-.02em;
}
.crest-text{padding-bottom:3px}
.crest-text b{display:block;font-size:13px;font-weight:600;letter-spacing:.06em}
.crest-text span{display:block;font-size:10.5px;color:var(--asagi);letter-spacing:.04em}
.lang{margin-left:auto;position:relative}
.globe{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:#D6E2EA;letter-spacing:.02em;
  background:rgba(255,255,255,.16);padding:6px 10px;border-radius:6px;
}
.globe .g{font-size:13px}
.globe .v{font-size:8px;opacity:.7}
.langmenu{
  position:absolute;right:0;top:36px;z-index:40;
  background:var(--washi);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(26,29,32,.3);overflow:hidden;min-width:172px;
}
.langmenu button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:13.5px;color:var(--sumi)}
.langmenu button[aria-pressed="true"]{background:var(--card);color:var(--ai);font-weight:600}
.langmenu[hidden]{display:none}
main{flex:1;position:relative}
/* ---------- detail ---------- */
.bar{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:10px;
  background:var(--washi);border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
}
.bar h1{font-size:14px;font-weight:600;letter-spacing:-.01em}
.bar .back{font-size:19px;line-height:1;color:var(--ai);padding:2px 4px}
.bar .right{margin-left:auto;font-size:12.5px;color:var(--sumi-faint)}
.submit{
  width:100%;background:var(--ai);color:#fff;padding:13px;
  border-radius:6px;font-size:14.5px;font-weight:600;
}
.sechead{padding:16px 18px;background:var(--ai);color:#DCE6ED}
.sechead h1{font-size:16px;font-weight:600}
.sechead p{font-size:12px;color:var(--asagi);margin-top:3px}
.empty{padding:60px 34px;text-align:center;color:var(--sumi-faint);font-size:13.5px;line-height:1.7}
/* ---------- calendar ---------- */
.mnav{display:flex;align-items:center;gap:6px;padding:14px 12px 10px}
.mnav h1{flex:1;text-align:center;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.mnav button{width:38px;height:34px;font-size:19px;color:var(--ai);border-radius:6px}
.wdrow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 4px}
.wdrow .wd{text-align:center;font-size:10.5px;color:var(--sumi-faint);padding-bottom:5px}
.wdrow .wd.sun{color:var(--beni)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 8px 12px;border-bottom:1px solid var(--line)}
.cell{aspect-ratio:1/1.05;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell.out{visibility:hidden}
.cell b{font-size:14px;font-weight:500;color:var(--sumi-soft);line-height:1}
.cell.today b{color:var(--beni);font-weight:700}
.cell[aria-pressed="true"]{background:var(--ai)}
.cell[aria-pressed="true"] b{color:#fff}
.cdots{display:flex;gap:2.5px;height:5px;align-items:center}
.cd{width:5px;height:5px;border-radius:50%;background:var(--asagi)}
.cd.gip{background:var(--beni)}.cd.office{background:var(--ai)}.cd.student{background:var(--line)}
.cell[aria-pressed="true"] .cd{background:#fff}
/* ---------- map ---------- */
.maphead{padding:16px 18px 4px}
.maphead h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.maphead p{font-size:12.5px;color:var(--sumi-faint);margin-top:2px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 18px 13px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-size:12.5px;padding:6px 12px;border-radius:15px;
  border:1px solid var(--line);background:var(--card);color:var(--sumi-soft)}
.fchip[aria-pressed="true"]{background:var(--c,var(--ai));border-color:var(--c,var(--ai));color:#fff;font-weight:600}
#lmap{height:330px;width:100%;background:var(--card);z-index:1}
.leaflet-container{font-family:var(--sans)}
.leaflet-control-attribution{font-size:9px}
.pindot{display:block;width:15px;height:15px;border-radius:50%;
  border:2.5px solid var(--washi);box-shadow:0 1px 3px rgba(20,24,28,.35)}
.pinw.on .pindot{width:23px;height:23px;margin:-4px 0 0 -4px;border-width:3px}
.homew b{display:block;width:32px;height:32px;border-radius:50%;background:var(--ai);
  color:var(--washi);font-size:14px;font-weight:600;line-height:32px;text-align:center;
  border:2.5px solid var(--washi);box-shadow:0 1px 4px rgba(20,24,28,.4)}
.clw{background:none;border:none}
.cl{width:34px;height:34px;border-radius:50%;background:var(--ai-mid);color:#fff;
  font-size:13px;font-weight:600;line-height:34px;text-align:center;
  border:2.5px solid var(--washi);box-shadow:0 1px 4px rgba(20,24,28,.3)}
.maperr{padding:40px 24px;text-align:center;color:var(--sumi-faint);font-size:13px}
.pcard{margin:8px 18px 4px;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:9px}
.pcard .pcat{font-size:11.5px;font-weight:600;margin-bottom:3px}
.pcard h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.pcard p{font-size:13.5px;color:var(--sumi-soft);margin-top:6px}
.pcard .pby{font-size:11.5px;color:var(--sumi-faint);margin-top:9px}
.glink{display:inline-block;margin-top:11px;font-size:12.5px;font-weight:600;
  color:var(--ai);text-decoration:underline;text-underline-offset:3px}
.plist{list-style:none;margin-top:12px;border-top:1px solid var(--line)}
.plist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.plist button[aria-pressed="true"]{background:var(--card)}
.plist .dotc{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.plist b{flex:1;font-weight:500}
.plist .pmin{font-size:12px;color:var(--sumi-faint)}
.daylabel{padding:13px 18px 6px;font-size:12px;font-weight:600;color:var(--sumi-faint);background:var(--washi-deep)}
.ev{position:relative;display:block;width:100%;text-align:left;padding:14px 18px 14px 62px;border-bottom:1px solid var(--line)}
.ev .clock{position:absolute;left:15px;top:15px;width:38px;text-align:right;font-size:12px;font-weight:600;color:var(--sumi-soft)}
.ev::after{content:"";position:absolute;left:56px;top:0;bottom:0;width:2.5px;background:var(--asagi)}
.ev.gip::after{background:var(--beni)}
.ev.office::after{background:var(--ai)}
.ev.student::after{background:var(--line)}
.ev h3{font-size:15px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.ev .sub{font-size:12.5px;color:var(--sumi-faint);margin-top:4px}
.ev .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 7px;border-radius:3px;background:var(--card);border:1px solid var(--line);color:var(--sumi-soft)}
.chip.rep{border-color:var(--asagi);color:var(--ai-mid)}

.evwrap{padding:20px 18px}
.evwrap .when{font-size:12.5px;color:var(--beni);font-weight:600;margin-bottom:6px}
.evwrap h1{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.015em}
.facts{margin:16px 0 0;border-top:1px solid var(--line)}
.facts div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.facts dt{flex:0 0 78px;color:var(--sumi-faint);font-size:12.5px;padding-top:1px}
.facts dd{flex:1}
.evwrap .body{font-size:15px;white-space:pre-wrap;margin-top:16px}
.evbtns{display:flex;gap:9px;margin-top:20px}
.evbtns button{flex:1;padding:12px;border-radius:6px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--sumi-soft)}
.evbtns .go{background:var(--ai);border-color:var(--ai);color:#fff}
.sect{padding:16px 18px 7px;font-size:12px;font-weight:600;color:var(--sumi-faint);
  background:var(--washi-deep)}
/* ---------- lessons ---------- */
.lesson{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px 18px;border-bottom:1px solid var(--line)}
.lvbadge{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--ai);
  color:var(--washi);font-size:13px;font-weight:700;line-height:28px;text-align:center}
.lvbadge.vn{background:var(--beni);font-size:11px}
.colrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px 18px;border-bottom:1px solid var(--line)}
.colthumbs{display:flex;gap:3px;flex:0 0 auto}
.colthumbs i{width:13px;height:18px;border-radius:2px;background:var(--line)}
.colthumbs i.on{background:var(--beni)}
.colmain b{display:block;font-size:14.5px;font-weight:600}
.colmain em{display:block;font-style:normal;font-size:12px;color:var(--sumi-faint);margin-top:2px}

/* ---- collection ---- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 9px 12px;overflow:hidden}
.card b{display:block;font-size:13px;font-weight:600;margin:9px 2px 0;line-height:1.4}
.card q{display:block;font-size:12px;color:var(--ai);margin:5px 2px 0;quotes:none}
.card p{font-size:11.5px;color:var(--sumi-faint);margin:6px 2px 0;line-height:1.5}
.card.lock b{color:var(--line);text-align:center}
.card.lock .cgart{background:var(--washi-deep);border-style:solid}
.cgart{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:7px;background:var(--washi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:11px;text-align:center;overflow:hidden}
.cgart img{width:100%;height:100%;object-fit:cover;border-radius:7px}
.cgart p{font-size:11px;color:var(--sumi-faint);line-height:1.45;margin:0}
.cgart small{font-size:10px;color:var(--line)}
.cgart.big{aspect-ratio:3/2;margin-bottom:16px}
.cgart.big p{font-size:12.5px}

/* ---- branching scenes ---- */
.routes{padding:14px 18px 20px;display:flex;flex-direction:column;gap:11px}
.route{text-align:left;padding:16px;border:1px solid var(--line);border-radius:11px;
  background:var(--card)}
.route b{display:block;font-size:16px;font-weight:600}
.route p{font-size:13px;color:var(--sumi-soft);margin-top:6px;line-height:1.55}
.route span{display:block;font-size:12.5px;color:var(--ai);font-weight:600;margin-top:11px}
.vnwrap{padding:14px 18px 24px}
.vndots{display:flex;gap:5px;margin-bottom:13px}
.vndots i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.vndots i.past{background:var(--asagi)}
.vndots i.now{background:var(--ai)}
.vnline{margin-top:14px}
.vnline b{font-size:12.5px;font-weight:600;color:var(--beni)}
.vnline p{font-size:16px;line-height:1.55;margin-top:5px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:17px}
.opts button{text-align:left;padding:13px 15px;border:1px solid var(--line);
  border-radius:9px;background:var(--washi);font-size:14.5px;line-height:1.45}
.opts button.chosen{opacity:.45;background:var(--card)}
.opts button.chosen.me{opacity:1;border-color:var(--ai);border-width:1.5px}
.fb{display:flex;gap:10px;margin-top:14px;padding:13px 15px;border-radius:9px;background:var(--card)}
.fb span{flex:0 0 auto;font-size:15px;line-height:1.4}
.fb.ok span{color:var(--ai)}
.fb.hm span{color:var(--beni)}
.fb p{font-size:13px;color:var(--sumi-soft);line-height:1.6}
.fb+.submit{margin-top:14px}
.vnend{padding:18px 18px 26px;text-align:center}
.vnend h1{font-size:21px;font-weight:600;letter-spacing:-.015em}
.vnend q{display:block;font-size:15px;color:var(--ai);margin-top:9px;quotes:none}
.endnote{font-size:13.5px;color:var(--sumi-soft);margin-top:14px;line-height:1.65;text-align:left}
.endscore{font-size:12px;color:var(--sumi-faint);margin-top:14px}
.lmain{flex:1;min-width:0}
.lmain b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.lmain em{display:block;font-style:normal;font-size:12.5px;color:var(--sumi-faint);margin-top:3px}
.lcuts{flex:0 0 auto;font-size:11.5px;color:var(--sumi-faint)}
.lhead{padding:18px 18px 4px}
.lhead h1{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.015em}
.lhead p{font-size:13px;color:var(--sumi-faint);margin-top:5px}
.cuts{padding:16px 18px 4px}
.cut{margin:0 0 18px}
.cut img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}
.cutph{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:10px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:18px;text-align:center}
.cutph span{font-size:11px;font-weight:700;color:var(--asagi)}
.cutph p{font-size:12.5px;color:var(--sumi-faint);line-height:1.5}
.cutph small{font-size:10.5px;color:var(--line)}
.cut figcaption{font-size:15px;font-weight:500;margin-top:9px;line-height:1.5}
.expr{padding:13px 18px;border-bottom:1px solid var(--line)}
.expr b{font-size:15.5px;font-weight:600}
.expr .rd{font-size:12px;color:var(--sumi-faint);margin-left:9px}
.expr p{font-size:13px;color:var(--sumi-soft);margin-top:5px;line-height:1.55}
/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;width:100%;max-width:var(--col);
  display:flex;background:var(--washi);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:30;
}
.tabbar button{flex:1;padding:11px 0 12px;font-size:11px;color:var(--sumi-faint)}
.tabbar button i{display:block;font-style:normal;font-size:17px;line-height:1.3}
.tabbar button[aria-pressed="true"]{color:var(--ai);font-weight:600}
.toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:var(--sumi);color:#F2F2EE;font-size:13px;
  padding:10px 17px;border-radius:20px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- MLP additions ---------- */
header{padding-bottom:14px}
.crest-text{min-width:0}
.crest-text b,.crest-text span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.globe{white-space:nowrap;min-height:44px}
.fchip{min-height:44px}
/* Korean wraps at spaces, not mid-word. */
html[lang="ko"] body{word-break:keep-all;overflow-wrap:anywhere}
.bar .back{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  margin:-10px 0 -10px -12px;font-size:22px}
.mnav button{width:44px;height:44px}

/* home */
.hhead{padding:22px 18px 4px}
.hhead h1{font-size:19px;font-weight:600;letter-spacing:-.015em}
.hcards{display:flex;flex-direction:column;gap:12px;padding:12px 18px 24px}
.hcard{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;
  border:1px solid var(--line);border-radius:12px;background:var(--card)}
.hcard i{flex:0 0 auto;width:42px;height:42px;border-radius:10px;background:var(--ai);color:var(--washi);
  font-style:normal;font-size:20px;line-height:42px;text-align:center}
.hcard.jp i{background:var(--beni)}
.hcard.map i{background:var(--ai-mid)}
.hcard span{flex:1;min-width:0}
.hcard b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.hcard em{display:block;font-style:normal;font-size:13px;color:var(--sumi-soft);margin-top:2px}
.hcard small{display:block;font-size:12px;color:var(--ai);margin-top:8px;font-weight:600}

/* map modes, notices, prefectures */
.seg{display:flex;margin:12px 18px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{flex:1;padding:10px 6px;font-size:13.5px;color:var(--sumi-soft);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ai);color:#fff;font-weight:600}
.notice{margin:12px 18px 0;padding:14px 15px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.notice b{display:block;font-size:14.5px;font-weight:600}
.notice p{font-size:12.5px;color:var(--sumi-soft);margin-top:6px;line-height:1.6}
.nbtns{display:flex;gap:8px;margin-top:12px}
.nbtns button{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;min-height:44px;
  border:1px solid var(--line);background:var(--washi);color:var(--sumi-soft)}
.nbtns .go{background:var(--ai);border-color:var(--ai);color:#fff}
.mmsg{margin:10px 18px 0;font-size:12.5px;color:var(--sumi-soft);line-height:1.6}
.mmsg button{color:var(--ai);font-weight:600;text-decoration:underline;text-underline-offset:2px;min-height:44px}
#lmap .leaflet-bar a{width:44px;height:44px;line-height:44px;font-size:22px}
.prefbar{display:flex;align-items:center;gap:10px;margin:8px 18px 0}
.prefbar b{flex:1;font-size:15.5px;font-weight:600}
.prefbar button{font-size:12.5px;color:var(--ai);font-weight:600;min-height:44px}
.lmapslot{min-height:330px;margin-top:4px}
.lmapslot .maperr{padding:140px 24px 0}
.preflist{display:flex;flex-wrap:wrap;gap:6px;padding:8px 18px 14px}

function d2(n){return String(n).padStart(2,"0")}
function today(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function addDays(k,n){return new Date(Date.parse(k+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);}
function dayDiff(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);}
function loc(){return S.lang==="ko"?"ko-KR":S.lang==="ja"?"ja-JP":"en-US";}
function stamp(k){const t=T[S.lang],d=new Date(k+"T00:00:00");
  return d.toLocaleDateString(loc(),{month:"short",day:"numeric"})+" · "+t.wd[d.getDay()];}

/* Occurrences on one day: one-off events on their date, weekly events every
   seventh day from d until weekly.until, with that day's override applied. */
function occOn(k){
  const out=[];
  for(const e of EVENTS){
    if(e.weekly){if(k<e.d||k>e.weekly.until||dayDiff(e.d,k)%7)continue;}
    else if(e.d!==k)continue;
    const o=(e.over&&e.over[k])||{};
    if(o.cancel)continue;
    out.push({e,d:k,t:o.t||e.t,b:o.b||e.b});
  }
  return out.sort((a,b)=>a.e.time<b.e.time?-1:a.e.time>b.e.time?1:0);
}
function upcoming(from,n){
  const out=[];let k=from;
  for(let i=0;i<180&&out.length<n;i++){out.push(...occOn(k));k=addDays(k,1);}
  return out.slice(0,n);
}

/* RFC 5545: escape text, fold lines at 75 octets, and carry the time zone. */
function icsEsc(s){return s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function icsFold(line){
  const enc=new TextEncoder();let out="",cur="",lim=75;
  for(const ch of line){
    if(enc.encode(cur+ch).length>lim){out+=cur+"\r\n ";cur="";lim=74;}
    cur+=ch;
  }
  return out+cur;
}
function downloadICS(o){
  const t=T[S.lang],e=o.e,dt=(k,h)=>k.replace(/-/g,"")+"T"+h.replace(":","")+"00";
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//YUI//EN",
   "BEGIN:VTIMEZONE","TZID:Asia/Tokyo","BEGIN:STANDARD","DTSTART:19700101T000000",
   "TZOFFSETFROM:+0900","TZOFFSETTO:+0900","TZNAME:JST","END:STANDARD","END:VTIMEZONE",
   "BEGIN:VEVENT","UID:"+e.id+"-"+o.d+"@yui","DTSTAMP:"+now,
   "DTSTART;TZID=Asia/Tokyo:"+dt(o.d,e.time),"DTEND;TZID=Asia/Tokyo:"+dt(o.d,e.end),
   "SUMMARY:"+icsEsc(o.t[S.lang]),"LOCATION:"+icsEsc(e.place[S.lang]),
   "DESCRIPTION:"+icsEsc(o.b[S.lang]),"END:VEVENT","END:VCALENDAR"].map(icsFold).join("\r\n")+"\r\n";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  /* revoking at once cancels the download in some browsers */
  a.download=e.id+"-"+o.d+".ics";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  toast(t.addedIcs);
}

function calendar(){
  const t=T[S.lang],now=today();
  const cur=S.month||now.slice(0,7);
  const [y,m]=cur.split("-").map(Number);
  const first=new Date(y,m-1,1),lead=first.getDay(),dim=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=0;i<lead;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(y+"-"+d2(m)+"-"+d2(d));
  while(cells.length%7)cells.push(null);
  const label=first.toLocaleDateString(loc(),{year:"numeric",month:"long"});
  const head=t.wdShort.map((w,i)=>`<div class="wd${i===0?" sun":""}">${w}</div>`).join("");
  const grid=cells.map(k=>{
    if(!k)return `<div class="cell out"></div>`;
    const dots=occOn(k).slice(0,3).map(o=>`<span class="cd ${o.e.kind}"></span>`).join("");
    return `<button class="cell${k===now?" today":""}" data-d="${k}" aria-pressed="${S.day===k}">
      <b>${+k.slice(-2)}</b><span class="cdots">${dots}</span></button>`;}).join("");
  const sel=S.day&&S.day.startsWith(cur)?S.day:null;
  let below;
  if(sel){
    const list=occOn(sel);
    below=`<div class="daylabel">${stamp(sel)}</div>`+
      (list.length?list.map(evRow).join(""):`<p class="empty">${t.noEv}</p>`);
  }else{
    const list=upcoming(now,3);
    below=list.length?list.map(o=>`<div class="daylabel">${stamp(o.d)}</div>`+evRow(o)).join("")
      :`<p class="empty">${t.homeNone}</p>`;
  }
  return `<div class="mnav">
      <button data-mv="-1" aria-label="${t.aPrev}">‹</button>
      <h1>${label}</h1>
      <button data-mv="1" aria-label="${t.aNext}">›</button></div>
    <div class="wdrow">${head}</div>
    <div class="grid">${grid}</div>
    ${below}`;
}

function curOcc(){return occOn(S.eday||"").find(o=>o.e.id===S.eid);}
function evDetail(){
  const t=T[S.lang],o=curOcc();

/* ---- map ---- */
/* Leaflet is created once. Its container (LBOX) lives outside render(): each
   render writes an empty #lmapslot and mountMap() moves LBOX back into it, so
   changing language or view never destroys the map. Map controls call
   updateMap(), which patches the containers and layers in place. */
let LBOX=null,LMAP=null,LCLUSTER=null,LPINS={},LME=null,LHOMEM=null,LZOOM=null,LPREF=null,PREFGEO=null,PREFLOAD=null,LEAFLET=null;
/* Set when location or boundaries arrive while the map is off screen, so the
   next mountMap() redraws and refits. MODEVIEW keeps each mode's last view. */
let MAPSTALE=false;const MODEVIEW={};

function ref(){return S.locState==="ok"&&S.loc?S.loc:HOME;}
function distM(a,b){
  const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;
  return 12742e3*Math.asin(Math.sqrt(h));
}
/* Straight-line distance x1.25 for streets, at 78 m/min (the hill up to campus). */
function walkMin(p){return Math.max(1,Math.round(distM(ref(),p)*1.25/78));}
const NEAR_M=3000;
function shownPlaces(){
  let list;
  if(S.mode==="near")list=PLACES.filter(p=>distM(ref(),p)<=NEAR_M).sort((a,b)=>distM(ref(),a)-distM(ref(),b));
  else if(S.pref)list=PLACES.filter(p=>p.pref===S.pref);
  else list=[];
  return list.filter(p=>!S.cat||p.cat===S.cat);
}
function prefName(code){const p=PREFS.find(x=>x[0]===code);return p?p[{ja:1,en:2,ko:3}[S.lang]]:code;}

function modesHTML(){
  const t=T[S.lang];
  return ["near","japan"].map(m=>`<button data-mode="${m}" aria-pressed="${S.mode===m}">${m==="near"?t.modeNear:t.modeJapan}</button>`).join("");
}
function statusHTML(){
  const t=T[S.lang];
  return statusMain(t)+(S.tileFail?`<p class="mmsg">${t.tileFail}</p>`:"");
}
function statusMain(t){
  if(S.mode==="japan"){
    if(S.pref)return `<div class="prefbar"><b>${esc(prefName(S.pref))}</b><button data-pref="">${t.prefAll}</button></div>`;
    return `<p class="mmsg">${t.prefPick}</p>`+(S.prefFail?`<p class="mmsg">${t.prefFail}</p>`:"");
  }
  switch(S.locState){
    case "ask":return `<div class="notice"><b>${t.locAskT}</b><p>${t.locAskB}</p>
      <div class="nbtns"><button class="go" data-loc="use">${t.locUse}</button><button data-loc="skip">${t.locSkip}</button></div></div>`;
    case "wait":return `<p class="mmsg">${t.locWait}</p>`;
    case "denied":return `<p class="mmsg">${t.locDenied}</p>`;
    case "fail":return `<p class="mmsg">${t.locFail}<button data-loc="use">${t.locRetry}</button></p>`;
    case "skip":return `<p class="mmsg">${t.locSkipped}<button data-loc="use">${t.locUse}</button></p>`;
    default:return "";
  }
}
function chipsHTML(){
  const t=T[S.lang];
  if(S.mode==="japan"&&!S.pref)return "";
  return `<button class="fchip" data-cat="" aria-pressed="${!S.cat}">${t.allCat}</button>`+
    Object.keys(t.cats).map(c=>`<button class="fchip" data-cat="${c}" aria-pressed="${S.cat===c}"
      style="--c:${CATCOLOR[c]}">${t.cats[c]}</button>`).join("");
}
function pcardHTML(){
  const t=T[S.lang],p=S.pl?PLACES.find(x=>x.id===S.pl):null;
  if(!p)return "";
  const walk=S.mode==="near"?" \u00B7 "+fill(t.walkAbout,{n:walkMin(p)}):"";
  return `<div class="pcard">
    <div class="pcat" style="color:${CATCOLOR[p.cat]}">${t.cats[p.cat]}${walk}</div>
    <h3>${esc(p.n[S.lang])}</h3>${p.d?`<p>${esc(p.d[S.lang])}</p>`:""}
    ${p.by?`<div class="pby">${t.addedBy} \u00B7 ${esc(t.by[p.by]||p.by)}</div>`:""}
    ${p.gid?`<a class="glink" href="${GMAP}${encodeURIComponent(p.gid)}" target="_blank" rel="noopener">${t.openMap}</a>`:""}</div>`;
}
function listHTML(){
  const t=T[S.lang];
  if(S.mode==="japan"&&!S.pref){
    const groups={};
    PREFS.forEach(p=>{(groups[regionOf(p[0])]=groups[regionOf(p[0])]||[]).push(p);});
    return Object.keys(t.regions).map(r=>`<div class="sect">${t.regions[r]}</div><div class="preflist">${
      groups[r].map(p=>{const n=PLACES.filter(x=>x.pref===p[0]).length;
        return `<button data-pref="${p[0]}"${n?' class="has"':""}>${esc(prefName(p[0]))}${n?`<small>${fill(t.prefCount,{n})}</small>`:""}</button>`;}).join("")
    }</div>`).join("");
  }
  const list=shownPlaces();
  if(!list.length)return `<p class="empty">${S.mode==="near"?t.nearEmpty:t.prefEmpty}</p>`;
  return `<ul class="plist">`+list.map(p=>`<li><button data-pl="${p.id}" aria-pressed="${S.pl===p.id}">
    <span class="dotc" style="background:${CATCOLOR[p.cat]}"></span>
    <b>${esc(p.n[S.lang])}</b>${S.mode==="near"?`<span class="pmin">${fill(t.walkAbout,{n:walkMin(p)})}</span>`:""}</button></li>`).join("")+`</ul>`;
}
function mapView(){
  const t=T[S.lang];
  return `<div class="maphead"><h1>${t.mapT}</h1></div>
    <div class="seg" id="mmodes">${modesHTML()}</div>
    <div id="mstatus">${statusHTML()}</div>
    <div class="filters" id="mfilters">${chipsHTML()}</div>
    <div class="lmapslot" id="lmapslot"><p class="maperr">${t.mapLoading}</p></div>
    <div id="pcardwrap">${pcardHTML()}</div>
    <div id="plist">${listHTML()}</div>`;
}

function lesson(){
  const t=T[S.lang],l=LESSONS.find(x=>x.id===S.lid);
  if(!l)return learn();
  if(l.vn)return vnView();
  const cuts=l.cuts.map((c,i)=>`<figure class="cut">
      ${c.img?`<img src="${esc(c.img)}" alt="">`
            :`<div class="cutph"><span>${i+1}</span><p>${esc(c.s)}</p>
               <small>${t.artTodo}</small></div>`}
      <figcaption>${esc(c.jp)}</figcaption>
    </figure>`).join("");
  const ex=l.ex.map(e=>`<div class="expr">
      <b>${esc(e.jp)}</b><span class="rd">${esc(e.rd)}</span>
      <p>${esc(e.g[S.lang])}</p></div>`).join("");
  return backBar(t.lvL+" "+l.lv)+`
    <div class="lhead"><h1>${esc(l.t[S.lang])}</h1><p>${esc(l.d[S.lang])}</p></div>
    <div class="cuts">${cuts}</div>
    <div class="sect">${t.exprT}</div>${ex}`;

function vnView(){
  const t=T[S.lang],v=S.vn,l=LESSONS.find(x=>x.id===S.lid);
  const bar=backBar(t.lvL+" "+(l?l.lv:""));
  if(!v.route){
    return bar+`<div class="lhead"><h1>${t.vnPick}</h1></div>
      <div class="routes">${["osaka","kyoto"].map(k=>`
        <button class="route" data-route="${k}">
          <b>${esc(VN[k].name[S.lang])}</b>
          <p>${esc(VN[k].blurb[S.lang])}</p>
          <span>${t.vnStart} →</span>
        </button>`).join("")}</div>`;
  }
  const R=VN[v.route],done=v.i>=R.scenes.length;
  if(done){
    const best=v.score>=4;
    const card=ENDINGS.find(e=>e.route===v.route&&e.best===best);
    return bar+`<div class="vnend">
        <div class="cgart big">${card.img?`<img src="${esc(card.img)}" alt="">`
          :`<p>${esc(card.s)}</p><small>${t.artTodo}</small>`}</div>
        <h1>${esc(card.t[S.lang])}</h1>
        <q>${esc(card.jp)}</q>
        <p class="endnote">${esc(card.n[S.lang])}</p>
        <p class="endscore">${t.vnScore} ${v.score} / ${R.scenes.length}</p>
        <div class="evbtns">
          <button class="go" data-vnreset>${t.vnBack}</button>
          <button data-col>${t.colT}</button></div>
      </div>`;
  }
  const sc=R.scenes[v.i];
  const dots=R.scenes.map((_,i)=>`<i class="${i<v.i?"past":i===v.i?"now":""}"></i>`).join("");
  const body=v.picked===null
    ? `<div class="opts">${sc.opts.map((o,i)=>`<button data-opt="${i}">${esc(o.jp)}</button>`).join("")}</div>`
    : (()=>{const o=sc.opts[v.picked];
        return `<div class="opts">${sc.opts.map((x,i)=>
          `<button class="chosen${i===v.picked?" me":""}" disabled>${esc(x.jp)}</button>`).join("")}</div>
          <div class="fb ${o.ok?"ok":"hm"}"><span>${o.ok?"○":"△"}</span>
            <p>${esc(o.fb[S.lang])}</p></div>
          <button class="submit" data-vnnext>${t.vnNext}</button>`;})();
  return bar+`<div class="vnwrap">
      <div class="vndots">${dots}</div>
      <div class="cgart">${sc.img?`<img src="${esc(sc.img)}" alt="">`
        :`<p>${esc(sc.s)}</p><small>${t.artTodo}</small>`}</div>
      <div class="vnline"><b>${esc(R.name[S.lang])}</b><p>${esc(sc.jp)}</p></div>
      ${body}
    </div>`;
}

/* ============ map runtime ============ */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");
  s.src=src;s.onload=ok;s.onerror=e=>{s.remove();no(e);};document.head.appendChild(s);});}
function loadLeaflet(){
  if(!LEAFLET){
    ["vendor/leaflet/leaflet.css","vendor/leaflet.markercluster/MarkerCluster.css"].forEach(h=>{
      if(document.querySelector(`link[href="${h}"]`))return;
      const l=document.createElement("link");l.rel="stylesheet";l.href=h;document.head.appendChild(l);});
    LEAFLET=loadScript("vendor/leaflet/leaflet.js")
      .then(()=>loadScript("vendor/leaflet.markercluster/leaflet.markercluster.js"))
      .catch(e=>{LEAFLET=null;throw e;});
  }
  return LEAFLET;
}
function pinIcon(p){
  return L.divIcon({className:"pinw"+(S.pl===p.id?" on":""),
    html:`<span class="pindot" style="background:${CATCOLOR[p.cat]}"></span>`,iconSize:[15,15],iconAnchor:[7,7]});
}
function mountMap(){
  const slot=$("lmapslot");if(!slot)return;
  if(LBOX){slot.innerHTML="";slot.appendChild(LBOX);LMAP.invalidateSize();
    labelMap();syncMap(MAPSTALE);MAPSTALE=false;return;}
  loadLeaflet().then(()=>{if(S.view==="map"&&!LBOX)initMap();})
    .catch(()=>{const s=$("lmapslot");if(s)s.innerHTML=`<p class="maperr">${T[S.lang].mapFail}</p>`;});
}
function initMap(){
  const slot=$("lmapslot");if(!slot)return;
  LBOX=document.createElement("div");LBOX.id="lmap";
  slot.innerHTML="";slot.appendChild(LBOX);
  LMAP=L.map(LBOX,{scrollWheelZoom:false,zoomControl:false});
  LZOOM=L.control.zoom().addTo(LMAP);
  const tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}).addTo(LMAP);
  /* Leaflet fires "load" once a batch settles, errors included, so count them per batch. */
  let tileErrs=0;
  tiles.on("loading",()=>{tileErrs=0;});
  tiles.on("tileerror",()=>{tileErrs++;});
  tiles.on("load",()=>{const f=tileErrs>0;if(f!==S.tileFail){S.tileFail=f;const el=$("mstatus");if(el)el.innerHTML=statusHTML();}});
  LHOMEM=L.marker([HOME.lat,HOME.lng],{zIndexOffset:1000,interactive:false}).addTo(LMAP);
  labelMap();
  LCLUSTER=L.markerClusterGroup({maxClusterRadius:42,showCoverageOnHover:false,spiderfyDistanceMultiplier:1.4,
    iconCreateFunction:c=>L.divIcon({className:"clw",html:`<div class="cl">${c.getChildCount()}</div>`,iconSize:[34,34]})});
  LMAP.addLayer(LCLUSTER);
  syncMap(true);MAPSTALE=false;
  setTimeout(()=>LMAP&&LMAP.invalidateSize(),60);
}
/* Strings Leaflet draws itself, refreshed on every mount so a language change reaches them. */
function labelMap(){
  const t=T[S.lang];
  LHOMEM.setIcon(L.divIcon({className:"homew",html:`<b>${esc(t.here)}</b>`,iconSize:[32,32],iconAnchor:[16,16]}));
  const zi=LBOX.querySelector(".leaflet-control-zoom-in"),zo=LBOX.querySelector(".leaflet-control-zoom-out");
  if(zi){zi.title=t.aZoomIn;zi.setAttribute("aria-label",t.aZoomIn);}
  if(zo){zo.title=t.aZoomOut;zo.setAttribute("aria-label",t.aZoomOut);}
  if(LME)LME.setIcon(meIcon());
}
function meIcon(){return L.divIcon({className:"mew",html:`<i title="${esc(T[S.lang].youHere)}"></i>`,iconSize:[22,22],iconAnchor:[11,11]});}
function prefStyle(f){
  const c=f.properties.c,has=PLACES.some(p=>p.pref===c),on=S.pref===c;
  return {color:on?"#B03A34":"#3D6A92",weight:on?2:1,fillColor:has?"#1D3E5C":"#8FB2C7",fillOpacity:on?.45:has?.3:.12};
}
function syncMap(fit){
  if(!LMAP)return;
  LCLUSTER.clearLayers();LPINS={};
  shownPlaces().forEach(p=>{
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(p),title:p.n[S.lang]});
    m.on("click",()=>{S.pl=S.pl===p.id?null:p.id;updateMap(false,true);});
    LPINS[p.id]=m;LCLUSTER.addLayer(m);
  });
  const showMe=S.mode==="near"&&S.locState==="ok"&&S.loc;
  if(showMe){
    if(!LME)LME=L.marker([S.loc.lat,S.loc.lng],{icon:meIcon(),zIndexOffset:900,interactive:false});
    LME.setLatLng([S.loc.lat,S.loc.lng]);if(!LMAP.hasLayer(LME))LME.addTo(LMAP);
  }else if(LME&&LMAP.hasLayer(LME))LMAP.removeLayer(LME);
  if(S.mode==="japan"&&PREFGEO){
    if(!LPREF)LPREF=L.geoJSON(PREFGEO,{style:prefStyle,
      onEachFeature:(f,layer)=>layer.on("click",()=>selectPref(f.properties.c))});
    LPREF.setStyle(prefStyle);
    if(!LMAP.hasLayer(LPREF))LPREF.addTo(LMAP);
  }else if(LPREF&&LMAP.hasLayer(LPREF))LMAP.removeLayer(LPREF);
  if(!fit)return;
  if(S.mode==="near"){
    const r=ref(),pts=shownPlaces().slice(0,8).map(p=>[p.lat,p.lng]).concat([[r.lat,r.lng]]);
    LMAP.fitBounds(L.latLngBounds(pts).pad(.15),{maxZoom:16});
  }else if(S.pref){
    let b=null;
    if(LPREF)LPREF.eachLayer(l=>{if(l.feature.properties.c===S.pref)b=mainBounds(l.feature.geometry);});
    const pts=shownPlaces().map(p=>[p.lat,p.lng]);
    if(b)LMAP.fitBounds(b,{padding:[8,8]});
    else if(pts.length)LMAP.fitBounds(L.latLngBounds(pts).pad(.2),{maxZoom:14});
  }else LMAP.fitBounds(JAPAN_BOUNDS);
}
/* Bounds of the largest polygon: Tokyo's Izu islands or Okinawa's outer islands
   would otherwise zoom the prefecture out to open sea. */
function mainBounds(g){
  const polys=g.type==="MultiPolygon"?g.coordinates:[g.coordinates];
  let best=null,area=-1;
  for(const poly of polys){
    const ring=poly[0];let a=0;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++)a+=(ring[j][0]+ring[i][0])*(ring[j][1]-ring[i][1]);
    if(Math.abs(a)>area){area=Math.abs(a);best=ring;}
  }
  return L.latLngBounds(best.map(c=>[c[1],c[0]]));
}
/* Picking a prefecture is a history step, so system back returns to all of Japan. */
function selectPref(code){
  if(!code&&S.pref&&history.state&&history.state.pref===S.pref&&history.state.pf){history.back();return;}
  S.pref=code;S.pl=null;S.cat="";
  try{history[code?"pushState":"replaceState"](Object.assign(snap(),{pf:!!code}),"");}catch(e){}
  updateMap(true);
}
/* fromPin: only the selection changed, so keep the view and restyle the pins. */
function updateMap(fit,fromPin){
  ["mmodes","mstatus","mfilters","pcardwrap","plist"].forEach(id=>{const el=$(id);
    if(el)el.innerHTML={mmodes:modesHTML,mstatus:statusHTML,mfilters:chipsHTML,pcardwrap:pcardHTML,plist:listHTML}[id]();});
  if(!LMAP)return;
  if(fromPin){
    Object.keys(LPINS).forEach(id=>{const p=PLACES.find(x=>x.id===id);if(p)LPINS[id].setIcon(pinIcon(p));});
    const sel=S.pl&&PLACES.find(p=>p.id===S.pl);
    if(sel)LMAP.setView([sel.lat,sel.lng],Math.max(LMAP.getZoom(),15),{animate:true});
  }else syncMap(fit);
}
function locate(){
  if(typeof navigator==="undefined"||!navigator.geolocation){S.locState="fail";updateMap(true);return;}
  S.locState="wait";updateMap(false);
  navigator.geolocation.getCurrentPosition(
    pos=>{S.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};S.locState="ok";delete MODEVIEW.near;locChanged();},
    err=>{S.locState=err.code===1?"denied":"fail";locChanged();},
    {enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}
function ensurePrefs(){
  if(PREFGEO||PREFLOAD)return;
  PREFLOAD=fetch("data/japan-prefectures.geojson").then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(g=>{PREFGEO=g;S.prefFail=false;mapChanged();})
    .catch(()=>{PREFLOAD=null;S.prefFail=true;mapChanged();});
}
/* Async results: apply now if the map is on screen, otherwise on the next mount. */
function mapChanged(){if(S.view==="map")updateMap(true);else MAPSTALE=true;}
/* A location result only moves the map in near mode; in Japan mode the user's
   view is left alone and near mode refits when they switch back. */
function locChanged(){if(S.mode==="near")mapChanged();else if(S.view==="map")updateMap(false);}
/* Switching mode returns to where that mode was left; the first visit fits. */
function setMode(m){
  if(LMAP)MODEVIEW[S.mode]={c:LMAP.getCenter(),z:LMAP.getZoom()};
  S.mode=m;S.pl=null;S.cat="";enterMap();
  try{history.replaceState(snap(),"");}catch(e){}
  const v=MODEVIEW[m];
  updateMap(!v||!LMAP);
  if(v&&LMAP)LMAP.setView(v.c,v.z,{animate:false});
}
/* Entering the map: ask for location only after the notice was accepted once. */
function enterMap(){
  if(S.mode==="near"&&S.locState==="idle")locate();
  if(S.mode==="japan")ensurePrefs();
}

/* ============ render & navigation ============ */
function dragScroll(el){
  if(!el||el._ds)return; el._ds=1;
  let down=false,x0=0,s0=0,moved=false,endedAt=0;
  el.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;x0=e.clientX;s0=el.scrollLeft;});
  el.addEventListener("pointermove",e=>{if(!down)return;const d=e.clientX-x0;
    if(!moved&&Math.abs(d)<4)return;moved=true;el.scrollLeft=s0-d;e.preventDefault();});
  const up=()=>{if(!down)return;down=false;if(moved)endedAt=Date.now();};
  el.addEventListener("pointerup",up);el.addEventListener("pointerleave",up);el.addEventListener("pointercancel",up);
  el.addEventListener("click",e=>{if(Date.now()-endedAt<120){e.preventDefault();e.stopPropagation();}},true);
}

function render(){
  const root=ROOTS.includes(S.view);
  document.documentElement.lang=S.lang;
  document.body.dataset.top=root?"ai":"washi";
  renderLang();renderTabs();
  $("main").innerHTML=VIEWS[S.view]();
  document.querySelector("header").style.display=root?"":"none";
  if(S.view==="map")mountMap();
  dragScroll($("mfilters"));
}
function snap(){return {v:S.view,lid:S.lid,eid:S.eid,eday:S.eday,prev:S.prevView,mode:S.mode,pref:S.pref};}
function go(view,replace){
  S.prevView=replace?S.prevView:S.view;S.view=view;S.menu=false;
  try{history[replace?"replaceState":"pushState"](snap(),"");}catch(e){}
  render();window.scrollTo(0,0);
  if(view==="map")enterMap();
}

/* ============ events ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(S.menu&&!(b&&b.hasAttribute("data-menu"))){S.menu=false;renderLang();}
  if(!b)return;
  const t=T[S.lang];
  if(b.hasAttribute("data-menu")){S.menu=!S.menu;renderLang();return;}
  if(b.dataset.l){S.lang=b.dataset.l;store.set("lang",S.lang);render();}
  else if(b.dataset.t!==undefined){const v=TABS[+b.dataset.t];
    if(v==="learn")S.lid=null;
    if(v==="cal"){S.day=null;S.month=null;}
    go(v,v===S.view);}
  else if(b.dataset.go){go(b.dataset.go);}
  else if(b.hasAttribute("data-back")){const p=PARENT[S.view]||"home";
    if(S.prevView===p)history.back();else go(p,true);}
  /* calendar */
  else if(b.dataset.e){const[id,day]=b.dataset.e.split("|");S.eid=id;S.eday=day;go("event");}
  else if(b.dataset.d){S.day=S.day===b.dataset.d?null:b.dataset.d;render();}
  else if(b.dataset.mv){const[y,m]=(S.month||today().slice(0,7)).split("-").map(Number);
    const nd=new Date(y,m-1+ +b.dataset.mv,1);
    S.month=nd.getFullYear()+"-"+d2(nd.getMonth()+1);render();}
  else if(b.hasAttribute("data-ics")){const o=curOcc();if(o)downloadICS(o);}
  /* map */
  else if(b.dataset.mode){if(b.dataset.mode!==S.mode)setMode(b.dataset.mode);}
  else if(b.dataset.loc){
    if(b.dataset.loc==="use"){store.set("loc","use");locate();}
    else{store.set("loc","skip");S.locState="skip";updateMap(true);}}
  else if(b.dataset.pref!==undefined){selectPref(b.dataset.pref||null);}
  else if(b.dataset.cat!==undefined&&b.classList.contains("fchip")){S.cat=b.dataset.cat;S.pl=null;updateMap(false);}
  else if(b.dataset.pl){S.pl=S.pl===b.dataset.pl?null:b.dataset.pl;updateMap(false,true);}
  /* Japanese */
  else if(b.dataset.lesson){S.lid=b.dataset.lesson;S.vn={route:null,i:0,picked:null,score:0};go("lesson");}
  else if(b.hasAttribute("data-col")){go("collection");}
  else if(b.dataset.route){S.vn={route:b.dataset.route,i:0,picked:null,score:0};render();}
  else if(b.dataset.opt!==undefined){const v=S.vn;
    v.picked=+b.dataset.opt;
    if(VN[v.route].scenes[v.i].opts[v.picked].ok)v.score++;
    render();}
  else if(b.hasAttribute("data-vnnext")){const v=S.vn;
    v.i++;v.picked=null;
    if(v.i>=VN[v.route].scenes.length){
      const card=ENDINGS.find(e=>e.route===v.route&&e.best===(v.score>=4));
      const fresh=!S.cg[card.id];S.cg[card.id]=true;
      const other=v.route==="osaka"?"kyoto":"osaka";
      if(ENDINGS.some(e=>e.route===other&&S.cg[e.id]))S.cg.e_both=true;
      store.set("cg",S.cg);
      render();toast(fresh?t.vnGot:t.vnHave);
    }else render();}
  else if(b.hasAttribute("data-vnreset")){S.vn={route:null,i:0,picked:null,score:0};render();}
});

/* Manifest shortcuts land here: ?v=learn|map|cal opens that tab. Shortcuts from
   the old board app keep working: ?tab=1 was Events, ?compose=1 goes home.
   Everything below this marker has side effects; the headless test cuts here. */
const q=new URLSearchParams(location.search);
S.lang=store.get("lang","en");if(!T[S.lang])S.lang="en";
{const cg=store.get("cg",{});S.cg=cg&&typeof cg==="object"&&!Array.isArray(cg)?cg:{};}
{const c=store.get("loc",null);S.locState=c==="use"?"idle":c==="skip"?"skip":"ask";}
{const st=history.state;
  if(st&&VIEWS[st.v]){S.view=st.v;S.lid=st.lid;S.eid=st.eid;S.eday=st.eday;S.prevView=st.prev;
    if(st.mode)S.mode=st.mode;S.pref=st.pref||null;}
  else S.view=ROOTS.includes(q.get("v"))?q.get("v"):q.get("tab")==="1"?"cal":"home";}
try{history.replaceState(snap(),"",location.pathname);}catch(e){}
addEventListener("popstate",e=>{const st=e.state;if(!st||!VIEWS[st.v])return;
  const sameMap=st.v==="map"&&S.view==="map";
  S.view=st.v;S.lid=st.lid;S.eid=st.eid;S.eday=st.eday;S.prevView=st.prev;S.menu=false;
  if(st.mode)S.mode=st.mode;S.pref=st.pref||null;S.pl=null;
  /* within the map, patch it in place so Leaflet keeps its state */
  if(sameMap){updateMap(true);return;}
  render();if(S.view==="map")enterMap();});
render();
if(S.view==="map")enterMap();

if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
