<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YUI Board — 結の掲示板</title>
<meta name="description" content="Events and community board for residents of GLOBAL COMMONS 結 -YUI-.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1D3E5C">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YUI">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<style>
:root{
  --washi:#E9EAE5;
  --washi-deep:#DEDFD8;
  --card:#F6F6F3;
  --sumi:#1A1D20;
  --sumi-soft:#5B6167;
  --sumi-faint:#8D9299;
  --ai:#1D3E5C;
  --ai-mid:#3D6A92;
  --asagi:#8FB2C7;
  --beni:#B03A34;
  --line:#C9CBC3;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --col:430px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--washi-deep);
  font-family:var(--sans);
  color:var(--sumi);
  line-height:1.6;
  font-size:15px;
  display:flex;justify-content:center;
  min-height:100dvh;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
}
/* Built for phones. Chrome elements shouldn't be text-selectable on touch. */
header,.tabbar,.strip,.boards,.bar{-webkit-user-select:none;user-select:none}
/* Hover styles only where a real pointer exists, so taps don't leave stuck states. */
@media(hover:hover){
  .boards,.filters{cursor:grab}
  .boards:active,.filters:active{cursor:grabbing}
      }
/* Fills the notch / status bar area in iOS standalone mode. */
#statusfill{position:fixed;top:0;left:0;right:0;z-index:60;
  height:env(safe-area-inset-top);background:var(--ai)}
body[data-top="washi"] #statusfill{background:var(--washi)}
#app{
  width:100%;max-width:var(--col);
  background:var(--washi);
  min-height:100vh;
  position:relative;
  box-shadow:0 0 0 1px var(--line);
  display:flex;flex-direction:column;
  padding-bottom:76px;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--ai);
  color:#EDF1F4;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;
}
.crest{display:flex;align-items:flex-end;gap:11px}
.knot{
  font-size:30px;line-height:.9;font-weight:600;
  letter-spacing:-.02em;
}
.crest-text{padding-bottom:3px}
.crest-text b{display:block;font-size:13px;font-weight:600;letter-spacing:.06em}
.crest-text span{display:block;font-size:10.5px;color:var(--asagi);letter-spacing:.04em}
.lang{margin-left:auto;position:relative}
.globe{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:#D6E2EA;letter-spacing:.02em;
  background:rgba(255,255,255,.16);padding:6px 10px;border-radius:6px;
}
.globe .g{font-size:13px}
.globe .v{font-size:8px;opacity:.7}
.langmenu{
  position:absolute;right:0;top:36px;z-index:40;
  background:var(--washi);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(26,29,32,.3);overflow:hidden;min-width:172px;
}
.langmenu button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:13.5px;color:var(--sumi)}
.langmenu button:hover{background:var(--card)}
.langmenu button[aria-pressed="true"]{background:var(--card);color:var(--ai);font-weight:600}
.langmenu p{padding:9px 14px 10px;font-size:11px;line-height:1.5;color:var(--sumi-faint);border-top:1px solid var(--line)}
.langmenu[hidden]{display:none}

.boardwrap{position:relative}
.boardwrap::before,.boardwrap::after{content:"";position:absolute;top:0;bottom:2px;width:30px;
  pointer-events:none;opacity:0;transition:opacity .15s}
.boardwrap::before{left:0;background:linear-gradient(to left,rgba(29,62,92,0),var(--ai) 72%)}
.boardwrap::after{right:0;background:linear-gradient(to right,rgba(29,62,92,0),var(--ai) 72%)}
.boardwrap[data-l="1"]::before{opacity:1}
.boardwrap[data-r="1"]::after{opacity:1}
.boards{
  display:flex;gap:2px;overflow-x:auto;
  margin-top:13px;
  scrollbar-width:none;
}
.boards::-webkit-scrollbar{display:none}
.boards button{
  white-space:nowrap;font-size:13px;
  padding:8px 13px 9px;
  color:#A9C0D2;
  border-bottom:2.5px solid transparent;
}
.boards button[aria-pressed="true"]{color:#fff;border-bottom-color:var(--beni)}

/* ---------- feed ---------- */
main{flex:1;position:relative}
.feed{list-style:none}
.post{
  display:block;width:100%;text-align:left;
  padding:15px 18px 12px;
  border-bottom:1px solid var(--line);
}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sumi-faint);margin-bottom:6px}
.bdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.tag{color:var(--sumi-soft);font-weight:600}
.meta .sep{opacity:.5}
.post h2{font-size:15.5px;font-weight:600;line-height:1.42;letter-spacing:-.012em}
.excerpt{font-size:13.5px;color:var(--sumi-soft);margin-top:5px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:24px;margin-top:11px}
.acts span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sumi-faint)}
.acts svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- detail ---------- */
.bar{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:10px;
  background:var(--washi);border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
}
.bar h1{font-size:14px;font-weight:600;letter-spacing:-.01em}
.bar .back{font-size:19px;line-height:1;color:var(--ai);padding:2px 4px}
.bar .right{margin-left:auto;font-size:12.5px;color:var(--sumi-faint)}
article{padding:18px 18px 20px}
article h1{font-size:19px;font-weight:600;line-height:1.38;letter-spacing:-.015em;margin-bottom:9px}
article .body{font-size:15px;white-space:pre-wrap;margin-top:12px}
.tr-note{
  font-size:12px;color:var(--sumi-faint);
  margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;align-items:center;gap:9px;
}
.tr-note button{color:var(--ai-mid);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.actions{display:flex;gap:9px;margin-top:18px}
.act{
  flex:1;padding:9px;border:1px solid var(--line);background:var(--card);
  border-radius:6px;font-size:13px;color:var(--sumi-soft);
}
.act[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
.act.warn{flex:0 0 auto;padding:9px 13px;color:var(--sumi-faint)}

.comments{border-top:8px solid var(--washi-deep);padding:6px 0 0}
.cmt{position:relative;padding:14px 18px;border-bottom:1px solid var(--line)}
.cmt.reply{padding-left:42px}
.cmt.reply::before{content:"";position:absolute;left:22px;top:16px;bottom:16px;
  width:2px;border-radius:1px;background:var(--line)}
.cmt .who{font-size:12.5px;font-weight:600;color:var(--sumi);margin-bottom:4px}
.cmt .who em{font-style:normal;font-weight:400;color:var(--sumi-faint);margin-left:6px}
.cmt.op .who{color:var(--ai)}
.cmt p{font-size:14px}


/* ---------- compose ---------- */
.compose{padding:18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--sumi-soft);margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;font:inherit;padding:10px 11px;
  border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--sumi);
}
.field textarea{min-height:170px;resize:vertical;line-height:1.65}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ai);background:#fff}
.hint{font-size:11.5px;color:var(--sumi-faint);margin-top:5px;line-height:1.5}
.submit{
  width:100%;background:var(--ai);color:#fff;padding:13px;
  border-radius:6px;font-size:14.5px;font-weight:600;
}

/* ---------- reports (RA) ---------- */
.ra-head{padding:16px 18px;background:var(--ai);color:#DCE6ED}
.ra-head h1{font-size:16px;font-weight:600}
.ra-head p{font-size:12px;color:var(--asagi);margin-top:3px}
.rep{padding:15px 18px;border-bottom:1px solid var(--line)}
.rep .reason{font-size:11.5px;color:var(--beni);font-weight:600;margin-bottom:4px}
.rep .quoted{font-size:13.5px;color:var(--sumi-soft);border-left:2px solid var(--line);padding-left:10px;margin-bottom:9px}
.rep .btns{display:flex;gap:7px}
.rep .btns button{border:1px solid var(--line);border-radius:5px;padding:6px 11px;font-size:12.5px;background:var(--card)}
.rep .btns .hide{color:var(--beni);border-color:#D8B0AD}

.empty{padding:60px 34px;text-align:center;color:var(--sumi-faint);font-size:13.5px;line-height:1.7}

/* ---------- calendar ---------- */
.mnav{display:flex;align-items:center;gap:6px;padding:14px 12px 10px}
.mnav h1{flex:1;text-align:center;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.mnav button{width:38px;height:34px;font-size:19px;color:var(--ai);border-radius:6px}
.wdrow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 4px}
.wdrow .wd{text-align:center;font-size:10.5px;color:var(--sumi-faint);padding-bottom:5px}
.wdrow .wd.sun{color:var(--beni)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 8px 12px;border-bottom:1px solid var(--line)}
.cell{aspect-ratio:1/1.05;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell.out{visibility:hidden}
.cell b{font-size:14px;font-weight:500;color:var(--sumi-soft);line-height:1}
.cell.today b{color:var(--beni);font-weight:700}
.cell[aria-pressed="true"]{background:var(--ai)}
.cell[aria-pressed="true"] b{color:#fff}
.cdots{display:flex;gap:2.5px;height:5px;align-items:center}
.cd{width:5px;height:5px;border-radius:50%;background:var(--asagi)}
.cd.gip{background:var(--beni)}.cd.office{background:var(--ai)}.cd.student{background:var(--line)}
.cell[aria-pressed="true"] .cd{background:#fff}

/* ---------- map ---------- */
.maphead{padding:16px 18px 4px}
.maphead h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.maphead p{font-size:12.5px;color:var(--sumi-faint);margin-top:2px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 18px 13px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-size:12.5px;padding:6px 12px;border-radius:15px;
  border:1px solid var(--line);background:var(--card);color:var(--sumi-soft)}
.fchip[aria-pressed="true"]{background:var(--c,var(--ai));border-color:var(--c,var(--ai));color:#fff;font-weight:600}
#lmap{height:330px;width:100%;background:var(--card);z-index:1}
.leaflet-container{font-family:var(--sans)}
.leaflet-control-attribution{font-size:9px}
.pindot{display:block;width:15px;height:15px;border-radius:50%;
  border:2.5px solid var(--washi);box-shadow:0 1px 3px rgba(20,24,28,.35)}
.pinw.on .pindot{width:23px;height:23px;margin:-4px 0 0 -4px;border-width:3px}
.homew b{display:block;width:32px;height:32px;border-radius:50%;background:var(--ai);
  color:var(--washi);font-size:14px;font-weight:600;line-height:32px;text-align:center;
  border:2.5px solid var(--washi);box-shadow:0 1px 4px rgba(20,24,28,.4)}
.clw{background:none;border:none}
.cl{width:34px;height:34px;border-radius:50%;background:var(--ai-mid);color:#fff;
  font-size:13px;font-weight:600;line-height:34px;text-align:center;
  border:2.5px solid var(--washi);box-shadow:0 1px 4px rgba(20,24,28,.3)}
.maperr{padding:40px 24px;text-align:center;color:var(--sumi-faint);font-size:13px}
.pcard{margin:8px 18px 4px;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:9px}
.pcard .pcat{font-size:11.5px;font-weight:600;margin-bottom:3px}
.pcard h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.pcard p{font-size:13.5px;color:var(--sumi-soft);margin-top:6px}
.pcard .pby{font-size:11.5px;color:var(--sumi-faint);margin-top:9px}
.glink{display:inline-block;margin-top:11px;font-size:12.5px;font-weight:600;
  color:var(--ai);text-decoration:underline;text-underline-offset:3px}
.plist{list-style:none;margin-top:12px;border-top:1px solid var(--line)}
.plist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.plist button[aria-pressed="true"]{background:var(--card)}
.plist .dotc{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.plist b{flex:1;font-weight:500}
.plist .pmin{font-size:12px;color:var(--sumi-faint)}

/* ---------- RA entry ---------- */
.raflag{margin-left:8px;font-size:13px;color:#C3D3DF;background:rgba(255,255,255,.16);
  padding:6px 9px;border-radius:6px}

.daylabel{padding:13px 18px 6px;font-size:12px;font-weight:600;color:var(--sumi-faint);background:var(--washi-deep)}
.ev{position:relative;display:block;width:100%;text-align:left;padding:14px 18px 14px 62px;border-bottom:1px solid var(--line)}
.ev:hover{background:var(--card)}
.ev .clock{position:absolute;left:15px;top:15px;width:38px;text-align:right;font-size:12px;font-weight:600;color:var(--sumi-soft)}
.ev::after{content:"";position:absolute;left:56px;top:0;bottom:0;width:2.5px;background:var(--asagi)}
.ev.gip::after{background:var(--beni)}
.ev.office::after{background:var(--ai)}
.ev.student::after{background:var(--line)}
.ev h3{font-size:15px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.ev .sub{font-size:12.5px;color:var(--sumi-faint);margin-top:4px}
.ev .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 7px;border-radius:3px;background:var(--card);border:1px solid var(--line);color:var(--sumi-soft)}
.chip.rep{border-color:var(--asagi);color:var(--ai-mid)}
.chip.full{border-color:#D8B0AD;color:var(--beni)}

.evwrap{padding:20px 18px}
.evwrap .when{font-size:12.5px;color:var(--beni);font-weight:600;margin-bottom:6px}
.evwrap h1{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.015em}
.facts{margin:16px 0 0;border-top:1px solid var(--line)}
.facts div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.facts dt{flex:0 0 78px;color:var(--sumi-faint);font-size:12.5px;padding-top:1px}
.facts dd{flex:1}
.evwrap .body{font-size:15px;white-space:pre-wrap;margin-top:16px}
.evbtns{display:flex;gap:9px;margin-top:20px}
.evbtns button{flex:1;padding:12px;border-radius:6px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--sumi-soft)}
.evbtns .go{background:var(--ai);border-color:var(--ai);color:#fff}
.evbtns .go[aria-pressed="true"]{background:var(--card);border-color:var(--ai);color:var(--ai)}

.rules{margin-top:4px;padding:13px 15px;background:var(--card);
  border:1px solid var(--line);border-radius:8px}
.rules b{display:block;font-size:12.5px;color:var(--sumi-soft);margin-bottom:7px}
.rules ul{margin:0;padding-left:16px}
.rules li{font-size:12.5px;color:var(--sumi-faint);line-height:1.65}
.rules li b{color:var(--beni);font-weight:600}
.rules .rok{font-size:12px;color:var(--sumi-soft);line-height:1.6;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}

.exbtn{width:100%;margin-top:9px;padding:11px;border-radius:6px;
  border:1px solid var(--ai);background:var(--washi);color:var(--ai);
  font-size:13.5px;font-weight:600}
.exbtn[disabled]{border-color:var(--line);color:var(--sumi-faint);background:var(--card)}
.warnbox2{padding:12px 14px;border-radius:8px;margin:13px 0 16px;
  background:#F6EDEC;border:1px solid #DFC0BD;
  font-size:12.5px;color:var(--sumi-soft);line-height:1.6}
.sect{padding:16px 18px 7px;font-size:12px;font-weight:600;color:var(--sumi-faint);
  background:var(--washi-deep)}
.req,.exch{padding:15px 18px;border-bottom:1px solid var(--line)}
.req .rline{font-size:14px;line-height:1.55}
.req .rline b{color:var(--ai)}
.rfrom{font-size:11.5px;color:var(--sumi-faint);margin-top:6px}
.req .btns{display:flex;gap:7px;margin-top:11px}
.req .btns button{flex:1;border:1px solid var(--line);border-radius:6px;padding:9px;
  font-size:13px;background:var(--card);color:var(--sumi-soft)}
.req .btns .ok{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:600}
.exch .xmain{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.exch .xmain b{font-size:15px;font-weight:600}
.exch .xroom{font-size:12px;color:var(--sumi-faint)}
.exch .xmain a{font-size:13px;color:var(--ai);text-decoration:underline;text-underline-offset:3px}
.exch .cut{margin-top:10px;font-size:12px;color:var(--sumi-faint);
  border:1px solid var(--line);border-radius:5px;padding:5px 10px;background:var(--card)}
.hasdot{position:relative}
.hasdot::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;
  border-radius:50%;background:var(--beni);border:1.5px solid var(--ai)}

/* ---------- lessons ---------- */
.lesson{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px 18px;border-bottom:1px solid var(--line)}
.lvbadge{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--ai);
  color:var(--washi);font-size:13px;font-weight:700;line-height:28px;text-align:center}
.lvbadge.vn{background:var(--beni);font-size:11px}
.colrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px 18px;border-bottom:1px solid var(--line)}
.colthumbs{display:flex;gap:3px;flex:0 0 auto}
.colthumbs i{width:13px;height:18px;border-radius:2px;background:var(--line)}
.colthumbs i.on{background:var(--beni)}
.colmain b{display:block;font-size:14.5px;font-weight:600}
.colmain em{display:block;font-style:normal;font-size:12px;color:var(--sumi-faint);margin-top:2px}

/* ---- collection ---- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 9px 12px;overflow:hidden}
.card b{display:block;font-size:13px;font-weight:600;margin:9px 2px 0;line-height:1.4}
.card q{display:block;font-size:12px;color:var(--ai);margin:5px 2px 0;quotes:none}
.card p{font-size:11.5px;color:var(--sumi-faint);margin:6px 2px 0;line-height:1.5}
.card.lock b{color:var(--line);text-align:center}
.card.lock .cgart{background:var(--washi-deep);border-style:solid}
.cgart{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:7px;background:var(--washi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:11px;text-align:center;overflow:hidden}
.cgart img{width:100%;height:100%;object-fit:cover;border-radius:7px}
.cgart p{font-size:11px;color:var(--sumi-faint);line-height:1.45;margin:0}
.cgart small{font-size:10px;color:var(--line)}
.cgart.big{aspect-ratio:3/2;margin-bottom:16px}
.cgart.big p{font-size:12.5px}

/* ---- branching scenes ---- */
.routes{padding:14px 18px 20px;display:flex;flex-direction:column;gap:11px}
.route{text-align:left;padding:16px;border:1px solid var(--line);border-radius:11px;
  background:var(--card)}
.route b{display:block;font-size:16px;font-weight:600}
.route p{font-size:13px;color:var(--sumi-soft);margin-top:6px;line-height:1.55}
.route span{display:block;font-size:12.5px;color:var(--ai);font-weight:600;margin-top:11px}
.vnwrap{padding:14px 18px 24px}
.vndots{display:flex;gap:5px;margin-bottom:13px}
.vndots i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.vndots i.past{background:var(--asagi)}
.vndots i.now{background:var(--ai)}
.vnline{margin-top:14px}
.vnline b{font-size:12.5px;font-weight:600;color:var(--beni)}
.vnline p{font-size:16px;line-height:1.55;margin-top:5px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:17px}
.opts button{text-align:left;padding:13px 15px;border:1px solid var(--line);
  border-radius:9px;background:var(--washi);font-size:14.5px;line-height:1.45}
.opts button.chosen{opacity:.45;background:var(--card)}
.opts button.chosen.me{opacity:1;border-color:var(--ai);border-width:1.5px}
.fb{display:flex;gap:10px;margin-top:14px;padding:13px 15px;border-radius:9px;background:var(--card)}
.fb span{flex:0 0 auto;font-size:15px;line-height:1.4}
.fb.ok span{color:var(--ai)}
.fb.hm span{color:var(--beni)}
.fb p{font-size:13px;color:var(--sumi-soft);line-height:1.6}
.fb+.submit{margin-top:14px}
.vnend{padding:18px 18px 26px;text-align:center}
.vnend h1{font-size:21px;font-weight:600;letter-spacing:-.015em}
.vnend q{display:block;font-size:15px;color:var(--ai);margin-top:9px;quotes:none}
.endnote{font-size:13.5px;color:var(--sumi-soft);margin-top:14px;line-height:1.65;text-align:left}
.endscore{font-size:12px;color:var(--sumi-faint);margin-top:14px}
.lmain{flex:1;min-width:0}
.lmain b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.lmain em{display:block;font-style:normal;font-size:12.5px;color:var(--sumi-faint);margin-top:3px}
.lcuts{flex:0 0 auto;font-size:11.5px;color:var(--sumi-faint)}
.lhead{padding:18px 18px 4px}
.lhead h1{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.015em}
.lhead p{font-size:13px;color:var(--sumi-faint);margin-top:5px}
.cuts{padding:16px 18px 4px}
.cut{margin:0 0 18px}
.cut img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}
.cutph{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:10px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:18px;text-align:center}
.cutph span{font-size:11px;font-weight:700;color:var(--asagi)}
.cutph p{font-size:12.5px;color:var(--sumi-faint);line-height:1.5}
.cutph small{font-size:10.5px;color:var(--line)}
.cut figcaption{font-size:15px;font-weight:500;margin-top:9px;line-height:1.5}
.expr{padding:13px 18px;border-bottom:1px solid var(--line)}
.expr b{font-size:15.5px;font-weight:600}
.expr .rd{font-size:12px;color:var(--sumi-faint);margin-left:9px}
.expr p{font-size:13px;color:var(--sumi-soft);margin-top:5px;line-height:1.55}

/* ---------- report sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,24,28,.42);z-index:70}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:71;
  width:100%;max-width:var(--col);background:var(--washi);
  border-radius:16px 16px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 28px rgba(20,24,28,.28)}
.sheet h2{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.sheet .swhy{font-size:13px;color:var(--sumi-soft);margin-top:4px}
.quoted2{font-size:12.5px;color:var(--sumi-faint);border-left:2px solid var(--line);
  padding-left:10px;margin:13px 0 4px;line-height:1.5}
.reasons{display:flex;flex-direction:column;margin-top:10px}
.reasons button{text-align:left;padding:13px 4px;font-size:14.5px;border-bottom:1px solid var(--line)}
.reasons button:first-child{color:var(--beni);font-weight:600}
.sheet .snote{font-size:11.5px;color:var(--sumi-faint);margin-top:13px;line-height:1.55}
.sheet .scancel{width:100%;margin-top:14px;padding:12px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--sumi-soft)}
.cmt .crep{position:absolute;right:12px;top:11px;font-size:13px;color:var(--sumi-faint);padding:4px 6px}
.rep .rmeta{font-size:11px;color:var(--sumi-faint);margin-bottom:6px}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;width:100%;max-width:var(--col);
  display:flex;background:var(--washi);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:30;
}
.tabbar button{flex:1;padding:11px 0 12px;font-size:11px;color:var(--sumi-faint)}
.tabbar button i{display:block;font-style:normal;font-size:17px;line-height:1.3}
.tabbar button[aria-pressed="true"]{color:var(--ai);font-weight:600}
.fab{
  position:fixed;right:calc(50% - var(--col)/2 + 16px);bottom:88px;z-index:29;
  width:52px;height:52px;border-radius:50%;
  background:var(--beni);color:#fff;font-size:23px;line-height:1;
  box-shadow:0 3px 12px rgba(26,29,32,.28);
}
@media(max-width:462px){.fab{right:16px}}
.toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:var(--sumi);color:#F2F2EE;font-size:13px;
  padding:10px 17px;border-radius:20px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function d2(n){return String(n).padStart(2,"0")}
function dstr(dt){return dt.getFullYear()+"-"+d2(dt.getMonth()+1)+"-"+d2(dt.getDate())}
function icsDate(d,t){return d.replace(/-/g,"")+"T"+t.replace(":","")+"00"}
function downloadICS(e){
  const t=T[S.lang];
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//YUI Board//EN","BEGIN:VEVENT",
   "UID:"+e.id+"@yui.board","DTSTART;TZID=Asia/Tokyo:"+icsDate(e.d,e.time),
   "DTEND;TZID=Asia/Tokyo:"+icsDate(e.d,e.end),
   "SUMMARY:"+e.t[S.lang],"LOCATION:"+e.place[S.lang],
   "DESCRIPTION:"+e.b[S.lang].replace(/\n/g,"\\n"),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download=e.id+".ics";a.click();URL.revokeObjectURL(a.href);
  toast(t.addedIcs);
}

/* ============ views ============ */
function feed(){
  const t=T[S.lang];
  let list=POSTS.filter(p=>!p.hidden&&(S.board==="all"||p.board===S.board));
  list=[...list].sort((a,b)=>a.min-b.min);
  if(!list.length)return `<p class="empty">${t.emptyBoard}</p>`;
  return `<ul class="feed">`+list.map(p=>`<li><button class="post" data-p="${p.id}">
      <div class="meta"><span class="bdot" style="background:${BCOLOR[p.board]}"></span>
        <span class="tag">${t.boards[p.board]}</span><span class="sep">·</span><span>${ago(p.min)}</span></div>
      <h2>${esc(p.t[S.lang])}</h2>
      <p class="excerpt">${esc(p.b[S.lang].replace(/\n/g," "))}</p>
      <div class="acts"><span>${IC.bub}${p.c.length}</span><span>${IC.hrt}${p.likes}</span></div>
    </button></li>`).join("")+`</ul>`;
}

      <button data-tr="${p.id}">${showing===S.lang?t.showOrig:t.showTr}</button></div>`:"";
  return `<div class="bar"><button class="back" data-back aria-label="${t.back}">‹</button>
      <h1>${t.boards[p.board]}</h1><span class="right">${ago(p.min)}</span></div>
    <article>
      <h1>${esc(p.t[showing])}</h1>
      <div class="body">${esc(p.b[showing])}</div>
      ${trRow}
      <div class="actions">
        <button class="act" data-like="${p.id}" aria-pressed="${p.liked}">♡ ${p.liked?t.liked:t.like} ${p.likes}</button>
        <button class="act warn" data-rep-post="${p.id}">⚑ ${t.report}</button>
      </div>
      ${EXBOARDS.includes(p.board)?`<button class="exbtn" data-ex="${p.id}"
        ${S.sent[p.id]?"disabled":""}>⇄ ${S.sent[p.id]?t.exDone:t.exReq}</button>`:""}
    </article>
    <div class="comments">${p.c.length?p.c.map((c,i)=>{
      const cs=["cmt",c.reply?"reply":"",c.op?"op":""].join(" ");
      return `<div class="${cs}"><div class="who">${who(c)}<em>${ago(c.min)}</em></div>
        <button class="crep" data-rep-cmt="${p.id}:${i}" aria-label="${t.report}">⚑</button>
        <p>${esc(c.t[S.lang])}</p></div>`;}).join(""):""}</div>`;
}

const CBOARDS=["free","meet","unit","market","lost"];
function compose(){
  const t=T[S.lang];
  const opts=CBOARDS.map(k=>`<option${S.cboard===k?" selected":""}>${t.boards[k]}</option>`).join("");
  return `<div class="bar"><button class="back" data-back aria-label="${t.back}">‹</button><h1>${t.composeT}</h1></div>
    <div class="compose">
      <div class="field"><label for="cb">${t.fBoard}</label>
        <select id="cb" data-cb>${opts}</select></div>
      <div class="field"><label for="ct">${t.fTitle}</label><input id="ct" maxlength="60"></div>
      <div class="field"><label for="cx">${t.fBody}</label><textarea id="cx"></textarea>
        <p class="hint">${t.anonNote}</p></div>
      <div class="rules">
        <b>${t.rulesT}</b>
        <ul>${t.rules.map(r=>`<li>${r}</li>`).join("")}</ul>
        <p class="rok">${t.rulesOk}</p>
      </div>
      <button class="submit" data-submit>${t.post}</button>
    </div>`;
}

function reports(){
  const t=T[S.lang];
  return `<div class="bar"><button class="back" data-back aria-label="${t.back}">‹</button><h1>${t.raBadge}</h1></div>
   <div class="ra-head"><h1>${t.raT}</h1><p>${t.raS}</p></div>`+
   (S.reps.length?S.reps.map(r=>`<div class="rep">
      <div class="reason">⚑ ${t.reasons[r.why]||r.why}</div>
      <div class="rmeta">${r.kind==="post"?t.repFrom:t.repFromC} · ${r.n}${t.repCount}</div>
      <div class="quoted">${esc(r.quoted)}</div>
      <div class="btns"><button data-keep="${r.id}">${t.keep}</button>
        <button class="hide" data-hide="${r.id}">${t.hide}</button></div>
    </div>`).join(""):`<p class="empty">${t.emptyRep}</p>`);
}

function evRow(e){
  const t=T[S.lang];
  const full=e.cap&&e.going>=e.cap;
  const chips=[];
  if(e.repeat)chips.push(`<span class="chip rep">↻ ${t.weekly}</span>`);
  if(e.cap)chips.push(`<span class="chip${full?" full":""}">${full?t.full:e.going+"/"+e.cap}</span>`);
  else if(e.going>3)chips.push(`<span class="chip">${t.going} ${e.going}${t.people}</span>`);
  return `<button class="ev ${e.kind}" data-e="${e.id}">
    <span class="clock">${e.time}</span>
    <h3>${esc(e.t[S.lang])}</h3>
    <p class="sub">${esc(e.place[S.lang])} · ${esc(HOSTS[e.host][S.lang].split("（")[0].split(" (")[0])}</p>
    ${chips.length?`<div class="chips">${chips.join("")}</div>`:""}
  </button>`;
}

function loc(){return S.lang==="ko"?"ko-KR":S.lang==="ja"?"ja-JP":"en-US";}

function calendar(){
  const t=T[S.lang];
  const cur=S.month||TODAY.slice(0,7);
  const [y,m]=cur.split("-").map(Number);
  const first=new Date(y,m-1,1), lead=first.getDay();
  const dim=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=0;i<lead;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(y+"-"+d2(m)+"-"+d2(d));
  while(cells.length%7)cells.push(null);
  const label=first.toLocaleDateString(loc(),{year:"numeric",month:"long"});
  const head=t.wdShort.map((w,i)=>`<div class="wd${i===0?" sun":""}">${w}</div>`).join("");
  const grid=cells.map(k=>{
    if(!k)return `<div class="cell out"></div>`;
    const evs=EVENTS.filter(e=>e.d===k);
    const dots=evs.slice(0,3).map(e=>`<span class="cd ${e.kind}"></span>`).join("");
    return `<button class="cell${k===TODAY?" today":""}" data-d="${k}" aria-pressed="${S.day===k}">
      <b>${+k.slice(-2)}</b><span class="cdots">${dots}</span></button>`;}).join("");
  const sel=S.day&&S.day.startsWith(cur)?S.day:null;
  const stamp=k=>{const d=new Date(k+"T00:00:00");
    return d.toLocaleDateString(loc(),{month:"short",day:"numeric"})+" · "+t.wd[d.getDay()];};
  let below;
  if(sel){
    const evs=EVENTS.filter(e=>e.d===sel);
    below=`<div class="daylabel">${stamp(sel)}</div>`+
      (evs.length?evs.map(evRow).join(""):`<p class="empty">${t.noEv}</p>`);
  }else{
    below=EVENTS.filter(e=>e.d>=TODAY).slice(0,3)
      .map(e=>`<div class="daylabel">${stamp(e.d)}</div>`+evRow(e)).join("");
  }
  return `<div class="mnav">
      <button data-mv="-1" aria-label="prev">‹</button>
      <h1>${label}</h1>
      <button data-mv="1" aria-label="next">›</button></div>
    <div class="wdrow">${head}</div>
    <div class="grid">${grid}</div>
    ${below}`;
}

function initMap(){
  const box=$("lmap");
  if(!box)return;
  if(typeof L==="undefined"||!L.markerClusterGroup){
    box.innerHTML=`<p class="maperr">${T[S.lang].mapFail}</p>`;return;
  }
  LMAP=L.map("lmap",{scrollWheelZoom:false,zoomControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(LMAP);

  L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:"homew",
    html:`<b>${T[S.lang].here}</b>`,iconSize:[32,32],iconAnchor:[16,16]}),
    zIndexOffset:1000}).addTo(LMAP);

  LCLUSTER=L.markerClusterGroup({
    maxClusterRadius:42,showCoverageOnHover:false,spiderfyDistanceMultiplier:1.4,
    iconCreateFunction:c=>L.divIcon({className:"clw",
      html:`<div class="cl">${c.getChildCount()}</div>`,iconSize:[34,34]})});
  LMAP.addLayer(LCLUSTER);
  drawPins();
  setTimeout(()=>LMAP&&LMAP.invalidateSize(),60);
}

function drawPins(fit){
  if(!LCLUSTER)return;
  LCLUSTER.clearLayers();LPINS={};
  const list=PLACES.filter(p=>!S.cat||p.cat===S.cat);
  list.forEach(p=>{
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(p),title:p.n[S.lang]});
    m.on("click",()=>{S.pl=S.pl===p.id?null:p.id;updateMap(true);});
    LPINS[p.id]=m;LCLUSTER.addLayer(m);
  });
  if(fit!==false){
    const pts=list.map(p=>[p.lat,p.lng]).concat([[HOME.lat,HOME.lng]]);
    LMAP.fitBounds(L.latLngBounds(pts).pad(0.12),{maxZoom:16});
  }
}

function updateMap(fromPin){
  if($("mfilters"))$("mfilters").innerHTML=chipsHTML();
  if($("pcardwrap"))$("pcardwrap").innerHTML=pcardHTML();
  if($("plist"))$("plist").innerHTML=plistHTML(PLACES.filter(p=>!S.cat||p.cat===S.cat));
  if(!LMAP)return;
  if(fromPin){
    Object.keys(LPINS).forEach(id=>{
      const p=PLACES.find(x=>x.id===id);if(p)LPINS[id].setIcon(pinIcon(p));});
    const sel=S.pl&&PLACES.find(p=>p.id===S.pl);
    if(sel)LMAP.setView([sel.lat,sel.lng],Math.max(LMAP.getZoom(),16),{animate:true});
  }else drawPins();
}

function fadeBoards(){
  const n=$("boards"),w=$("boardwrap");
  if(!n||!w)return;
  const max=n.scrollWidth-n.clientWidth;
  w.dataset.l=n.scrollLeft>2?"1":"0";
  w.dataset.r=(max>2&&n.scrollLeft<max-2)?"1":"0";
}

function dragScroll(el){
  if(!el||el._ds)return; el._ds=1;
  let down=false,x0=0,s0=0,moved=false,endedAt=0;
  el.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="mouse")return;
    down=true;moved=false;x0=e.clientX;s0=el.scrollLeft;
  });
  el.addEventListener("pointermove",e=>{
    if(!down)return;
    const d=e.clientX-x0;
    if(!moved&&Math.abs(d)<4)return;
    moved=true;el.scrollLeft=s0-d;e.preventDefault();
  });
  const up=()=>{if(!down)return;down=false;if(moved)endedAt=Date.now();};
  el.addEventListener("pointerup",up);
  el.addEventListener("pointerleave",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("click",e=>{
    if(Date.now()-endedAt<120){e.preventDefault();e.stopPropagation();}
  },true);
}

               learn:learn,lesson:lesson,collection:collection}[S.view];
  $("main").innerHTML=v()+sheet();
  $("fab").style.display=S.view==="feed"?"":"none";
  $("raflag").style.display=(S.isRA&&S.view==="feed")?"":"none";
  $("profbtn").style.display=S.view==="feed"?"":"none";
  $("profbtn").className="raflag"+(REQS.length?" hasdot":"");
  document.querySelector("header").style.display=["feed","cal","map","learn"].includes(S.view)?"":"none";
  $("boardwrap").style.display=S.view==="feed"?"":"none";
  if(S.view!=="map"&&LMAP){LMAP.remove();LMAP=null;LCLUSTER=null;}
  if(S.view==="map"&&!LMAP)initMap();
  dragScroll($("boards"));dragScroll($("mfilters"));
  const bn=$("boards");
  if(bn&&!bn._fd){bn._fd=1;
    bn.addEventListener("scroll",fadeBoards,{passive:true});
    addEventListener("resize",fadeBoards);}
  fadeBoards();setTimeout(fadeBoards,60);
  window.scrollTo(0,0);
}

  const g=e.target.closest("g.pin");
  if(g){S.pl=S.pl===g.dataset.pl?null:g.dataset.pl;render();return;}
  const b=e.target.closest("button");if(!b)return;
  const t=T[S.lang];
  if(b.hasAttribute("data-menu")){S.menu=!S.menu;render();return;}
  if(S.menu)S.menu=false;
  if(b.dataset.l){S.lang=b.dataset.l;render();}
  else if(b.dataset.b){S.board=b.dataset.b;S.tab=0;render();}
  else if(b.dataset.p){S.pid=+b.dataset.p;S.view="post";render();}
  else if(b.hasAttribute("data-back")){S.view="feed";render();}
  else if(b.dataset.tr){const id=+b.dataset.tr;S.tr[id]=S.tr[id]==="orig"?"tr":"orig";render();}
  else if(b.dataset.like){const p=POSTS.find(x=>x.id===+b.dataset.like);
    p.liked=!p.liked;p.likes+=p.liked?1:-1;render();}
  else if(b.dataset.repPost){const p=POSTS.find(x=>x.id===+b.dataset.repPost);
    if(S.mine["p"+p.id])return toast(t.repAlready);
    S.sheet={kind:"post",pid:p.id,quoted:p.t[S.lang]};render();}
  else if(b.dataset.repCmt){const[pid,ci]=b.dataset.repCmt.split(":");
    if(S.mine["c"+pid+"-"+ci])return toast(t.repAlready);
    const c=POSTS.find(x=>x.id===+pid).c[+ci];
    S.sheet={kind:"cmt",pid:+pid,ci:+ci,quoted:c.t[S.lang]};render();}
  else if(b.hasAttribute("data-close")){S.sheet=null;render();}
  else if(b.dataset.why){const sh=S.sheet;
    const key=sh.kind==="post"?"p"+sh.pid:"c"+sh.pid+"-"+sh.ci;
    S.mine[key]=true;
    const hit=S.reps.find(r=>r.kind===sh.kind&&r.pid===sh.pid&&r.ci===sh.ci&&r.why===b.dataset.why);
    if(hit)hit.n++;
    else S.reps.unshift({id:++repSeq,why:b.dataset.why,kind:sh.kind,
      pid:sh.pid,ci:sh.ci,n:1,quoted:sh.quoted});
    S.sheet=null;S.view="feed";render();toast(t.repDone);}
  else if(b.hasAttribute("data-submit")){
    const ti=$("ct").value.trim(),bo=$("cx").value.trim();
    if(!ti||!bo)return;
    POSTS.unshift({id:Date.now(),board:S.cboard,src:S.lang,min:0,likes:0,liked:false,
      t:{ja:ti,en:ti,ko:ti},b:{ja:bo,en:bo,ko:bo},c:[]});
    S.board="all";S.tab=0;S.view="feed";render();toast(t.posted);}
  else if(b.dataset.keep){S.reps=S.reps.filter(r=>r.id!=b.dataset.keep);render();toast(t.kept);}
  else if(b.dataset.hide){const r=S.reps.find(x=>x.id==b.dataset.hide);
    if(r&&r.kind==="post"&&r.pid){const p=POSTS.find(x=>x.id===r.pid);if(p)p.hidden=true;}
    S.reps=S.reps.filter(x=>x.id!=b.dataset.hide);render();toast(t.hidden);}
  else if(b.dataset.e){S.eid=b.dataset.e;S.view="event";render();}
  else if(b.dataset.d){S.day=S.day===b.dataset.d?null:b.dataset.d;render();}
  else if(b.dataset.mv){const[y,m]=(S.month||TODAY.slice(0,7)).split("-").map(Number);
    const nd=new Date(y,m-1+ +b.dataset.mv,1);
    S.month=nd.getFullYear()+"-"+d2(nd.getMonth()+1);render();}
  else if(b.dataset.cat!==undefined&&b.classList.contains("fchip")){
    S.cat=b.dataset.cat;S.pl=null;LMAP?updateMap():render();}
  else if(b.dataset.pl){S.pl=S.pl===b.dataset.pl?null:b.dataset.pl;
    LMAP?updateMap(true):render();}
  else if(b.hasAttribute("data-ra")){S.view="reports";render();}
  else if(b.hasAttribute("data-prof")){S.view="profiles";render();}
  else if(b.dataset.lesson){S.lid=b.dataset.lesson;
    S.vn={route:null,i:0,picked:null,score:0};S.view="lesson";render();}
  else if(b.hasAttribute("data-col")){S.view="collection";render();}
  else if(b.dataset.route){S.vn={route:b.dataset.route,i:0,picked:null,score:0};render();}
  else if(b.dataset.opt!==undefined){const v=S.vn;
    v.picked=+b.dataset.opt;
    if(VN[v.route].scenes[v.i].opts[v.picked].ok)v.score++;
    render();}
  else if(b.hasAttribute("data-vnnext")){const v=S.vn;
    v.i++;v.picked=null;
    if(v.i>=VN[v.route].scenes.length){
      const card=ENDINGS.find(e=>e.route===v.route&&e.best===(v.score>=4));
      const fresh=!S.cg[card.id];S.cg[card.id]=true;
      const other=v.route==="osaka"?"kyoto":"osaka";
      if(ENDINGS.some(e=>e.route===other&&S.cg[e.id]))S.cg.e_both=true;
      render();toast(fresh?t.vnGot:t.vnHave);
    }else render();}
  else if(b.hasAttribute("data-vnreset")){S.vn={route:null,i:0,picked:null,score:0};render();}
  else if(b.dataset.ex){
    if(sentToday>=DAILY_LIMIT)return toast(t.exLimit);
    S.sheet={kind:"ex",pid:+b.dataset.ex};render();}
  else if(b.dataset.exsend){const pid=+b.dataset.exsend;
    sentToday++;S.sent[pid]=true;S.sheet=null;render();toast(t.exSent);}
  else if(b.dataset.acc){const r=REQS.find(x=>x.id===b.dataset.acc);
    REQS=REQS.filter(x=>x.id!==b.dataset.acc);
    EXCH.unshift({id:"x"+(++exSeq),name:r.name,room:r.room,insta:r.insta,pid:r.pid,at:0});
    render();toast(t.exOk);}
  else if(b.dataset.dec){REQS=REQS.filter(x=>x.id!==b.dataset.dec);render();toast(t.exNo);}
  else if(b.dataset.cut){EXCH=EXCH.filter(x=>x.id!==b.dataset.cut);render();toast(t.exCut);}
  else if(b.dataset.go){const ev=EVENTS.find(x=>x.id===b.dataset.go);
    S.going[ev.id]=!S.going[ev.id];render();if(S.going[ev.id])toast(t.joinedT);}
  else if(b.dataset.ics){downloadICS(EVENTS.find(x=>x.id===b.dataset.ics));}
  else if(b.dataset.t!==undefined){S.tab=+b.dataset.t;
    S.view=["feed","cal","learn","map"][S.tab];
    if(S.tab===0)S.board="all";
    if(S.tab===2)S.lid=null;
    if(S.tab===1){S.day=null;S.month=null;}
    if(S.tab===3)S.pl=null;
    render();}
  else if(b.id==="fab"){S.cboard="free";S.view="compose";render();}
});

/* Manifest shortcuts land here: ?tab=1 opens Events, ?compose=1 opens the composer. */
const q=new URLSearchParams(location.search);
if(q.get("tab")==="1"){S.tab=1;S.view="cal";}
if(q.get("compose")==="1"){S.view="compose";}

render();

if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
